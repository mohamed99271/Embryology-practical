tivation, contribute. A protein-rich meal has the largest SDA in this textbook model."}],"F":[{"page":41,"title":"Energy balance, hunger, appetite and satiety","body":"Maintaining body weight involves balancing long-term energy intake and expenditure, while the HYPOTHALAMUS integrates hormonal, neural and metabolic information. The LIMBIC SYSTEM adds reward/emotional drives. HUNGER is the internal physiological need-driven drive to eat. APPETITE is a psychological desire for food (you can want pizza despite a full stomach). SATIETY is fullness after food that inhibits continued eating. SATIETY IS NOT A HORMONE. Hunger and appetite increase the likelihood of eating, whereas satiety opposes further eating.","explain_ar":"Hunger = الجوع الفسيولوجي، يعني الجسم يدفعك تدور على غذاء. Appetite = الشهية أو رغبة نفسية في أكلة معينة حتى لو شبعان. Satiety = إحساس الشبع بعد الأكل اللي يقلل رغبتك في الاستمرار ويؤخر وجبة تانية. لا تخلط: Satiety مش هرمون؛ لما الشبع يزيد غالبًا الشهية تقل.\nالـHypothalamus في المخ شبكة تنظيم الطاقة والجوع والشبع، والـLimbic system يضيف الجانب العاطفي والمكافأة: ممكن تكون شبعان لكن ريحة بيتزا أو وجود أصحابك يخلوك تاكل. ثبات الوزن طويل الأجل يعتمد على تقارب Energy intake وEnergy expenditure.","key_en":"Maintaining body weight involves balancing long-term energy intake and expenditure, while the HYPOTHALAMUS integrates hormonal, neural and metabolic information. The LIMBIC SYSTEM adds reward/emotional drives. HUNGER is the internal physiological need-driven drive to eat. APPETITE is a psychological desire for food (you can want pizza despite a full stomach). SATIETY is fullness after food that inhibits continued eating. SATIETY IS NOT A HORMONE. Hunger and appetite increase the likelihood of eating, whereas satiety opposes further eating."},{"page":42,"title":"The feeding and satiety centers","body":"The classical HYPOTHALAMIC APPESTAT model describes two opposing centers: the FEEDING CENTER (LATERAL HYPOTHALAMIC region) and the SATIETY CENTER (VENTROMEDIAL HYPOTHALAMIC region). Electrical activation of feeding center promotes HYPERPHAGIA (excessive eating); bilateral injury can cause APHAGIA (little or no eating) and starvation. Stimulating ventromedial satiety circuitry suppresses feeding, while bilateral disruption can cause excessive eating and obesity. Other key nuclei: paraventricular, dorsomedial and arcuate. These findings are a classical teaching simplification; actual feeding control is distributed.\nAFFERENT signals travel FROM peripheral tissues TO the nervous system. Oral/buccal receptors sense chewing, swallowing, touch, taste and smell, sending early feedback that can temporarily reduce hunger even before nutrient absorption.","explain_ar":"النموذج الكلاسيكي في الكتاب بيقسم مراكز الـHypothalamus إلى Feeding center في Lateral hypothalamus (يشجّع الأكل)، وSatiety center في Ventromedial hypothalamus (يكبح الأكل). لو فعّلت الأول يحدث Hyperphagia (أكل زائد)، ولو حصل Bilateral lesion يعني تلف في الجانبين ممكن يحصل Aphagia (توقف الأكل). لو فعّلت مركز الشبع يتوقف الأكل، ولو تلف في الناحيتين قد يحدث Hyperphagia وسمنة. دي نتائج نموذج مبسط، والمخ الحقيقي أعقد.\nالمخ يستقبل Afferent signals من الجسم: وقت المضغ والبلع والتذوق والشم ترسل مستقبلات الفم معلومات تقلل الجوع مؤقتًا، حتى قبل امتصاص الغذاء. احفظ: Feeding broken → Aphagia، Satiety broken → Hyperphagia.","key_en":"The classical HYPOTHALAMIC APPESTAT model describes two opposing centers: the FEEDING CENTER (LATERAL HYPOTHALAMIC region) and the SATIETY CENTER (VENTROMEDIAL HYPOTHALAMIC region). Electrical activation of feeding center promotes HYPERPHAGIA (excessive eating); bilateral injury can cause APHAGIA (little or no eating) and starvation. Stimulating ventromedial satiety circuitry suppresses feeding, while bilateral disruption can cause excessive eating and obesity. Other key nuclei: paraventricular, dorsomedial and arcuate. These findings are a classical teaching simplification; actual feeding control is distributed.\nAFFERENT signals travel FROM peripheral tissues TO the nervous system. Oral/buccal receptors sense chewing, swallowing, touch, taste and smell, sending early feedback that can temporarily reduce hunger even before nutrient absorption."},{"page":43,"title":"Gut stretch, temperature and classical theories","body":"As the stomach and duodenum DISTEND, GI MECHANORECEPTORS signal fullness through VAGAL AFFERENTS. Environmental cold can increase food-seeking while heat can suppress appetite. Blood GLUCOSE, AMINO ACIDS, LIPIDS and GUT HORMONES influence the hypothalamus.\nSHORT-TERM regulation limits meal size and duration using gastrointestinal stretch, oral sensory signals and rapidly released gut hormones. LONG-TERM regulation aims to stabilize adipose energy stores over weeks, months and years using nutrient levels, fat-derived hormones and other environmental signals.\nGLUCOSTATIC THEORY: rising glucose after a meal promotes satiety; low glucose (hypoglycemia) can release hunger circuits. LIPOSTATIC THEORY: fat stores communicate with hypothalamus through signals such as LEPTIN, usually reducing appetite when stores increase. Increased fat does not always prevent hunger owing partly to leptin resistance.","explain_ar":"لما المعدة والاثنا عشر يتمددوا، Stretch receptors تحس بالتمدد وترسل إشارات عبر Vagus nerve (العصب الحائر) للمخ فتقل شدة الجوع. البرد غالبًا يزيد الشهية والحر يقللها؛ وفيه كمان إشارات كيميائية من الجلوكوز والأحماض الأمينية والدهون وهرمونات الجهاز الهضمي.\nShort-term regulation تمنع الإفراط في الوجبة الواحدة: تمدد الجهاز الهضمي، إشارات الفم، هرمونات بعد الأكل. Long-term regulation تحفظ مخزون الدهون والطاقة عبر أسابيع وشهور: مستويات مغذيات الدم، إشارات النسيج الدهني، والتكيف البيئي. Glucostatic: جلوكوز ↑ شبع ↑، جلوكوز ↓ جوع ↑. Lipostatic: الدهون المخزنة تؤثر على الشهية، ومن أهم إشاراتها Leptin.","key_en":"As the stomach and duodenum DISTEND, GI MECHANORECEPTORS signal fullness through VAGAL AFFERENTS. Environmental cold can increase food-seeking while heat can suppress appetite. Blood GLUCOSE, AMINO ACIDS, LIPIDS and GUT HORMONES influence the hypothalamus.\nSHORT-TERM regulation limits meal size and duration using gastrointestinal stretch, oral sensory signals and rapidly released gut hormones. LONG-TERM regulation aims to stabilize adipose energy stores over weeks, months and years using nutrient levels, fat-derived hormones and other environmental signals.\nGLUCOSTATIC THEORY: rising glucose after a meal promotes satiety; low glucose (hypoglycemia) can release hunger circuits. LIPOSTATIC THEORY: fat stores communicate with hypothalamus through signals such as LEPTIN, usually reducing appetite when stores increase. Increased fat does not always prevent hunger owing partly to leptin resistance."},{"page":44,"title":"Aminostatic theory, neurons and ghrelin","body":"AMINOSTATIC THEORY proposes that higher circulating amino acids increase satiety and reduce appetite. In the ARCUATE NUCLEUS (ARC), OREXIGENIC NPY/AgRP neurons stimulate food intake when energy stores are low. NPY directly stimulates appetite; AgRP antagonizes melanocortin receptor signals that promote satiety. ANOREXIGENIC POMC/CART neurons suppress appetite when energy is abundant. POMC is processed to alpha-MSH, which activates MC4R (especially in related hypothalamic pathways) to reduce food intake. CART is another satiety-associated pathway.\nGHRELIN, produced mainly by the stomach, is a hormone of hunger: levels rise while fasting and before meals, fall after eating, and stimulate NPY/AgRP cells. Simple chain: FASTING -> GHRELIN UP -> NPY/AgRP UP -> HUNGER UP.","explain_ar":"Aminostatic theory: لما الأحماض الأمينية في الدم تزيد، تنشيط الشبع يزيد وتقل الشهية بحسب النظرية. داخل Arcuate nucleus مجموعتين عكس بعض: NPY/AgRP = Orexigenic = تزوّد الجوع؛ POMC/CART = Anorexigenic = تقلل الشهية. NPY يحفز تناول الطعام، وAgRP يعاكس مستقبلات الشبع الميلانوكورتينية. POMC يتكوّن منه α-MSH الذي ينشّط MC4R فيقل الأكل.\nGhrelin هرمون الجوع ويأتي أساسًا من المعدة، يزيد خلال الصيام وقبل الوجبة ويقل بعد الطعام. بيحفز NPY/AgRP؛ لذلك السلسلة: Fasting → Ghrelin ↑ → NPY/AgRP ↑ → Appetite ↑. خليك فاكر إن كل ما يزيد Appetite تزيد الرغبة في الأكل، مش الشبع.","key_en":"AMINOSTATIC THEORY proposes that higher circulating amino acids increase satiety and reduce appetite. In the ARCUATE NUCLEUS (ARC), OREXIGENIC NPY/AgRP neurons stimulate food intake when energy stores are low. NPY directly stimulates appetite; AgRP antagonizes melanocortin receptor signals that promote satiety. ANOREXIGENIC POMC/CART neurons suppress appetite when energy is abundant. POMC is processed to alpha-MSH, which activates MC4R (especially in related hypothalamic pathways) to reduce food intake. CART is another satiety-associated pathway.\nGHRELIN, produced mainly by the stomach, is a hormone of hunger: levels rise while fasting and before meals, fall after eating, and stimulate NPY/AgRP cells. Simple chain: FASTING -> GHRELIN UP -> NPY/AgRP UP -> HUNGER UP."},{"page":45,"title":"Leptin functions and negative feedback","body":"LEPTIN is a peptide hormone released by ADIPOCYTES, approximately in proportion to fat stores. In the classical model it enters the brain through regulated transport, influences hypothalamic areas including arcuate and paraventricular nuclei, REDUCES NPY orexigenic signaling, increases satiety-associated mediators (including CRH) and can increase SYMPATHETIC activity/energy expenditure.\nFAT GAIN -> LEPTIN RISES -> NPY falls, appetite decreases, expenditure may rise. FAT LOSS -> LEPTIN FALLS -> loss of inhibition over NPY, hunger rises and energy expenditure tends to fall. This is NEGATIVE FEEDBACK. Some people with high adiposity have high leptin but reduced biological response (LEPTIN RESISTANCE), so leptin is not a guaranteed stop-eating signal. Higher cortex also influences eating through psychological condition, learned habits, culture and social setting.","explain_ar":"Leptin رسالة من الخلايا الدهنية للمخ بتقول إن فيه مخزون طاقة. كلما زاد مخزون الدهون غالبًا زاد اللبتين، فيثبط NPY ويزيد إشارات الشبع وينشط مسارات استهلاك الطاقة ومنها النشاط السمبثاوي. لو الدهون نقصت، اللبتين ينقص، الفرامل على NPY تضعف، فيزيد الجوع وقد يقل صرف الطاقة. ده Negative feedback: الجسم يحاول يعاكس تغير المخزون.\nسؤالك المهم: ليه بعض الأشخاص المصابين بالسمنة يفضلوا يأكلوا رغم ارتفاع اللبتين؟ بسبب Leptin resistance: استجابة المخ للبتين قد تكون ضعيفة رغم ارتفاع مستواه. تناول الطعام كمان بيتأثر بالحالة النفسية، والعادات المتعلمة، والثقافة والأصدقاء. الدماغ له مستقبلات في Arcuate وParaventricular nuclei، واللبتين يصل إليه عبر آليات نقل عبر الحاجز الدموي الدماغي.","key_en":"LEPTIN is a peptide hormone released by ADIPOCYTES, approximately in proportion to fat stores. In the classical model it enters the brain through regulated transport, influences hypothalamic areas including arcuate and paraventricular nuclei, REDUCES NPY orexigenic signaling, increases satiety-associated mediators (including CRH) and can increase SYMPATHETIC activity/energy expenditure.\nFAT GAIN -> LEPTIN RISES -> NPY falls, appetite decreases, expenditure may rise. FAT LOSS -> LEPTIN FALLS -> loss of inhibition over NPY, hunger rises and energy expenditure tends to fall. This is NEGATIVE FEEDBACK. Some people with high adiposity have high leptin but reduced biological response (LEPTIN RESISTANCE), so leptin is not a guaranteed stop-eating signal. Higher cortex also influences eating through psychological condition, learned habits, culture and social setting."},{"page":46,"title":"Obesity and adipose expansion","body":"OBESITY is excessive fat accumulation in adipose tissue that affects health. Long-term energy excess and limited activity are common contributors; obesity also involves GENETIC, ENDOCRINE, MEDICATION and PSYCHOLOGICAL/BEHAVIORAL factors. Endocrine examples: hypothyroidism, Cushing syndrome, polycystic ovarian syndrome (PCOS), hypothalamic lesions. Medication groups named: glucocorticoids, some atypical antipsychotics, MAO inhibitors and some oral contraceptive preparations (weight effects vary). Depression and emotional overeating may contribute.\nBODY MASS INDEX (BMI) = weight(kg)/[height(m)]^2. US units: 703 x weight(lb)/[height(in)]^2. An example 90 kg / (1.5)^2 = 40 kg/m2. BMI is a screening index, not a direct fat measurement. ADIPOCYTE HYPERPLASIA = number of cells INCREASES; ADIPOCYTE HYPERTROPHY = existing cells become LARGER as lipid accumulates. The lecture associates more hyperplasia with childhood-onset and hypertrophy with adult-onset obesity, although both may coexist.","explain_ar":"Obesity هي تراكم زائد للدهون في Adipose tissue بدرجة تضر الصحة؛ مش مجرد رقم وزن كبير، لأن العضلات ترفع الوزن من غير زيادة الدهون بنفس الدرجة. أسباب المحاضرة خمس مجموعات: قلة الحركة مع فائض السعرات، وراثة، اضطرابات هرمونية (مثل Hypothyroidism وCushing وPCOS وآفات hypothalamus)، أدوية (مثل Glucocorticoids وبعض مضادات الذهان)، وعوامل نفسية/سلوكية.\nBMI = Weight kg / (Height m)². مثل 90 kg مع 1.5 m = 40 kg/m². مؤشر فحص مش تحليل دقيق لكمية الدهون. في الرسم: Hyperplasia زيادة عدد الخلايا الدهنية، Hypertrophy زيادة حجم الخلايا الموجودة بسبب الدهون المتراكمة. طفل/بالغ في الرسم ارتباط شائع لا قانون مطلق؛ الاتنين ممكن يحصلوا في أعمار مختلفة.","key_en":"OBESITY is excessive fat accumulation in adipose tissue that affects health. Long-term energy excess and limited activity are common contributors; obesity also involves GENETIC, ENDOCRINE, MEDICATION and PSYCHOLOGICAL/BEHAVIORAL factors. Endocrine examples: hypothyroidism, Cushing syndrome, polycystic ovarian syndrome (PCOS), hypothalamic lesions. Medication groups named: glucocorticoids, some atypical antipsychotics, MAO inhibitors and some oral contraceptive preparations (weight effects vary). Depression and emotional overeating may contribute.\nBODY MASS INDEX (BMI) = weight(kg)/[height(m)]^2. US units: 703 x weight(lb)/[height(in)]^2. An example 90 kg / (1.5)^2 = 40 kg/m2. BMI is a screening index, not a direct fat measurement. ADIPOCYTE HYPERPLASIA = number of cells INCREASES; ADIPOCYTE HYPERTROPHY = existing cells become LARGER as lipid accumulates. The lecture associates more hyperplasia with childhood-onset and hypertrophy with adult-onset obesity, although both may coexist."},{"page":47,"title":"Obesity treatment, starvation, cachexia and eating disorders","body":"Management types: 1) dietary restriction plus activity, 2) PHARMACOTHERAPY including appetite-regulating agents and intestinal lipase inhibitors, 3) behavioral/other supportive interventions, and 4) BARIATRIC SURGERY such as gastric bypass or adjustable banding. Effective care is individualized; acupuncture evidence is less clear than established treatments.\nSTARVATION is absence or marked inadequacy of food intake; the body uses glycogen, fat and eventually muscle as energy sources. Causes listed include unavailable food, coma, surgery, feeding-center injury and severe anorexia nervosa. Prolonged starvation leads to muscle weakness, lethargy, reduced BMR, lowered cardiovascular/respiratory performance and nutritional deficiencies. INANITION describes profound weakness/wasting from severe undernutrition.\nCACHEXIA is progressive muscle wasting, often with fat loss, associated with chronic disease such as advanced cancer, AIDS and inflammatory conditions; it is not fully reversed by nutrition alone. ANOREXIA NERVOSA is restriction of food due to fear of weight gain and disturbed body image. BULIMIA NERVOSA involves recurrent binge eating plus compensatory actions such as vomiting, laxative misuse, fasting or excessive exercise. Anorexia can cause starvation; it is not the same as starvation itself.","explain_ar":"علاج السمنة في المحاضرة أربعة خطوط: تعديل الغذاء والنشاط البدني، أدوية لتنظيم الشهية أو تقليل امتصاص الدهون، دعم سلوكي/وسائل مساعدة، وجراحات السمنة مثل Gastric bypass أو Gastric banding.\nStarvation معناه حرمان شديد أو كامل من الغذاء فيستهلك الجسم مخزونه، وقد يسبب ضعف عضلات وخمول وانخفاض BMR وضربات القلب والضغط والسعة الحيوية ونقص الفيتامينات. Cachexia هزال مرتبط بمرض مزمن شديد (مثل السرطان المتقدم) فيه فقد عضلي واضح وغالبًا فقد دهون، ومش بيرجع طبيعي بمجرد زيادة الأكل. Inanition هزال شديد من سوء التغذية الطويل.\nAnorexia nervosa: تقييد شديد للأكل مع خوف من الوزن وصورة جسم مضطربة. Bulimia nervosa: نوبات أكل بنهم مع فقد السيطرة ثم سلوك تعويضي ضار كالتقيؤ أو إساءة استخدام الملينات أو الصيام أو التمرين المفرط. أنوركسيا مش نفس ستارفشن: اضطراب الأكل ممكن يسبب الحرمان لكنه مش اسم كل حالات الحرمان.","key_en":"Management types: 1) dietary restriction plus activity, 2) PHARMACOTHERAPY including appetite-regulating agents and intestinal lipase inhibitors, 3) behavioral/other supportive interventions, and 4) BARIATRIC SURGERY such as gastric bypass or adjustable banding. Effective care is individualized; acupuncture evidence is less clear than established treatments.\nSTARVATION is absence or marked inadequacy of food intake; the body uses glycogen, fat and eventually muscle as energy sources. Causes listed include unavailable food, coma, surgery, feeding-center injury and severe anorexia nervosa. Prolonged starvation leads to muscle weakness, lethargy, reduced BMR, lowered cardiovascular/respiratory performance and nutritional deficiencies. INANITION describes profound weakness/wasting from severe undernutrition.\nCACHEXIA is progressive muscle wasting, often with fat loss, associated with chronic disease such as advanced cancer, AIDS and inflammatory conditions; it is not fully reversed by nutrition alone. ANOREXIA NERVOSA is restriction of food due to fear of weight gain and disturbed body image. BULIMIA NERVOSA involves recurrent binge eating plus compensatory actions such as vomiting, laxative misuse, fasting or excessive exercise. Anorexia can cause starvation; it is not the same as starvation itself."}],"T":[{"page":49,"title":"Core principle and heat transfer routes","body":"The body's heat content depends on METABOLIC HEAT PRODUCTION and HEAT EXCHANGE with surroundings. Thermal balance means heat produced approximately equals net heat lost while body temperature stays stable. Four important pathways: RADIATION (infrared heat exchange without contact), CONDUCTION (direct contact between warmer and cooler materials), CONVECTION (transfer by moving air or water), and EVAPORATION (liquid sweat changes to vapor, removing heat). Radiation and conduction can also move heat INTO the body if surroundings are hotter; they are heat-exchange mechanisms.","explain_ar":"الجسم بينتج حرارة من Metabolism، وفي نفس الوقت بيبادل الحرارة مع المكان. لما الإنتاج يساوي صافي الفقد تقريبًا، درجة حرارة الجسم تفضل مستقرة: Thermal balance. فيه أربع طرق أساسية: Radiation إشعاع تحت الأحمر دون لمس، Conduction تلامس مباشر، Convection حركة هواء أو ماء، وEvaporation تحوّل سائل العرق لبخار ويسحب حرارة.\nتخيّل حيطة أبرد منك من غير ما تلمسها = Radiation. كرسي معدن بارد تلمسه = Conduction. مروحة بتبدّل الهوا السخن جنب جلدك = Convection. عرق بيتبخر = Evaporation. الحرارة ممكن تتحرك للداخل في الثلاثة الأولى لو المكان أسخن من جسمك.","key_en":"The body's heat content depends on METABOLIC HEAT PRODUCTION and HEAT EXCHANGE with surroundings. Thermal balance means heat produced approximately equals net heat lost while body temperature stays stable. Four important pathways: RADIATION (infrared heat exchange without contact), CONDUCTION (direct contact between warmer and cooler materials), CONVECTION (transfer by moving air or water), and EVAPORATION (liquid sweat changes to vapor, removing heat). Radiation and conduction can also move heat INTO the body if surroundings are hotter; they are heat-exchange mechanisms."},{"page":50,"title":"Evaporation and hypothalamic thermostat","body":"Radiation: you exchange infrared radiation with nearby walls even without touching. Conduction: sitting on a cold metal chair transfers heat from skin to chair. Convection: air currents or a fan replace warmed air beside skin with cooler air. Evaporation: sweat VAPOR, not merely secreted sweat, removes heat. When air temperature exceeds skin temperature, evaporation is the key effective route for body cooling. Humidity can greatly reduce evaporative efficiency.\nThe HYPOTHALAMUS coordinates thermal homeostasis using sensory temperature feedback. It compares actual body-temperature signals against an INTERNAL SET POINT, around 37 C as a teaching example, and recruits physiologic responses that reduce the difference.","explain_ar":"أهم نقطة: نزول العرق على الجلد مش هو التبريد نفسه؛ **تبخّره** هو اللي يسحب حرارة. لو الجو حار جدًا وأعلى من حرارة الجلد، إشعاع وتلامس وحمل الحرارة قد يدخلوا حرارة للجسم، فيبقى التبخر أهم طريق للتبريد. الرطوبة العالية تقلل التبخر حتى لو الجسم بيعرق كثير.\nالـHypothalamus زي ترموستات تكييف ذكي: يستقبل إشارات الحرارة ويقارنها بالـSet point (تقريبًا 37°C في المثال). لو الحرارة الفعلية أعلى يفعّل فقد الحرارة، ولو أقل يفعّل الاحتفاظ بها وإنتاجها. Set point مش القراءة الحالية للترمومتر؛ هو الهدف اللي الجسم بيحاول يحافظ عليه.","key_en":"Radiation: you exchange infrared radiation with nearby walls even without touching. Conduction: sitting on a cold metal chair transfers heat from skin to chair. Convection: air currents or a fan replace warmed air beside skin with cooler air. Evaporation: sweat VAPOR, not merely secreted sweat, removes heat. When air temperature exceeds skin temperature, evaporation is the key effective route for body cooling. Humidity can greatly reduce evaporative efficiency.\nThe HYPOTHALAMUS coordinates thermal homeostasis using sensory temperature feedback. It compares actual body-temperature signals against an INTERNAL SET POINT, around 37 C as a teaching example, and recruits physiologic responses that reduce the difference."},{"page":51,"title":"Thermoregulatory neural centers and receptors","body":"The ANTERIOR HYPOTHALAMUS / PREOPTIC AREA contains warm-sensitive neurons and is associated with HEAT LOSS: SWEATING, SKIN VASODILATION and inhibition of shivering. The POSTERIOR HYPOTHALAMUS integrates responses to COLD: SHIVERING, SKIN VASOCONSTRICTION and increased heat production/conservation. These are classical functional divisions, not fully isolated centers.\nCENTRAL thermoreceptors in brain, spinal cord and deep abdominal organs monitor internal/core temperature. CUTANEOUS thermoreceptors in the skin detect changes outside the body. Sensory information passes to hypothalamic controllers, which use autonomic pathways including SYMPATHETIC efferents to control skin blood vessels and sweat glands; shivering uses somatic motor pathways.","explain_ar":"في نموذج المحاضرة: Anterior hypothalamus/Preoptic area = مركز فقد الحرارة، فيه Warm-sensitive neurons؛ لما الجسم يسخن، يحصل Sweating وVasodilation ويتثبط Shivering. Posterior hypothalamus = استجابات البرد والاحتفاظ بالحرارة؛ يعمل Vasoconstriction وShivering وزيادة إنتاج الحرارة.\nالـCentral thermoreceptors موجودة داخل المخ والحبل الشوكي وأعضاء عميقة وتحس بحرارة الداخل Core. الـCutaneous thermoreceptors في الجلد وتحس بالجو الخارجي سريعًا. الـSNS يساعد في تنفيذ الأوامر على أوعية الجلد والغدد العرقية، بينما رعشة العضلات تعتمد على مسارات حركة جسدية. افتكر: Central inside، Cutaneous skin.","key_en":"The ANTERIOR HYPOTHALAMUS / PREOPTIC AREA contains warm-sensitive neurons and is associated with HEAT LOSS: SWEATING, SKIN VASODILATION and inhibition of shivering. The POSTERIOR HYPOTHALAMUS integrates responses to COLD: SHIVERING, SKIN VASOCONSTRICTION and increased heat production/conservation. These are classical functional divisions, not fully isolated centers.\nCENTRAL thermoreceptors in brain, spinal cord and deep abdominal organs monitor internal/core temperature. CUTANEOUS thermoreceptors in the skin detect changes outside the body. Sensory information passes to hypothalamic controllers, which use autonomic pathways including SYMPATHETIC efferents to control skin blood vessels and sweat glands; shivering uses somatic motor pathways."},{"page":52,"title":"Responses to hot and cold weather","body":"HEAT: cutaneous VASODILATION increases skin blood flow, SWEATING uses sympathetic CHOLINERGIC fibers that release acetylcholine onto ECCRINE glands, and SHIVERING is suppressed to limit metabolic heat production. Sweat cools the body only when it evaporates.\nCOLD: cutaneous VASOCONSTRICTION reduces warm blood at skin and decreases heat loss. COUNTERCURRENT exchange transfers heat from warm arteries to returning colder veins in extremities. PILO-ERECTION is contraction of arrector pili muscles that raises hairs; useful for insulation in furry animals but weak in humans. SHIVERING is involuntary repetitive skeletal muscle activity that MAKES heat. Cold raises MUSCLE TONE and can trigger shivering; voluntary movement also generates heat. SHIVERING = HEAT PRODUCTION; VASOCONSTRICTION = HEAT CONSERVATION. Alcohol does not safely warm the body.","explain_ar":"في الحر: Cutaneous vasodilation توسع أوعية الجلد ويمر دم دافئ أكثر قريب من السطح، فيسهل فقد الحرارة لو البيئة أبرد؛ وActive sweating من Eccrine glands اللي تنشطها Sympathetic cholinergic fibers (تطلق Acetylcholine)، ثم يحدث تبخر؛ ويتثبط Shivering لتقليل إنتاج الحرارة.\nفي البرد: Vasoconstriction يضيّق الأوعية ويمنع ضياع الحرارة، Countercurrent heat exchange يحتفظ بالحرارة من الدم الشرياني للوريدي العائد، Pilo-erection انقباض Arrector pili يجعل الشعر يقف (جلد الوزة) لكنه ضعيف الفاعلية عند الإنسان. Shivering = عضلات تنقبض لا إراديًا لتوليد حرارة جديدة. افتكر: Constriction يحتفظ، Shivering يصنع.","key_en":"HEAT: cutaneous VASODILATION increases skin blood flow, SWEATING uses sympathetic CHOLINERGIC fibers that release acetylcholine onto ECCRINE glands, and SHIVERING is suppressed to limit metabolic heat production. Sweat cools the body only when it evaporates.\nCOLD: cutaneous VASOCONSTRICTION reduces warm blood at skin and decreases heat loss. COUNTERCURRENT exchange transfers heat from warm arteries to returning colder veins in extremities. PILO-ERECTION is contraction of arrector pili muscles that raises hairs; useful for insulation in furry animals but weak in humans. SHIVERING is involuntary repetitive skeletal muscle activity that MAKES heat. Cold raises MUSCLE TONE and can trigger shivering; voluntary movement also generates heat. SHIVERING = HEAT PRODUCTION; VASOCONSTRICTION = HEAT CONSERVATION. Alcohol does not safely warm the body."},{"page":53,"title":"Extra cold mechanisms and mechanism of fever","body":"Other cold defenses taught include VOLUNTARY muscular activity (stamping feet or clapping), increased food intake and SDA-related heat production, and sympathetic/thyroid responses that increase heat production, especially with prolonged cold adaptation. The handout emphasizes protein's SDA (~30% in the previous lecture).\nFEVER (PYREXIA) is a REGULATED increase in body temperature due to a rise in the HYPOTHALAMIC SET POINT. EXOGENOUS PYROGENS such as bacterial endotoxin activate immune cells including monocytes, macrophages and Kupffer cells. These release ENDOGENOUS PYROGENIC CYTOKINES such as IL-1. Inflammatory signals boost PGE2 synthesis in thermoregulatory pathways, and PGE2 raises set point. Pathway: PYROGEN -> IMMUNE CELLS -> IL-1 -> PGE2 -> SET POINT UP -> FEVER. Aspirin and similar ANTIPYRETICS inhibit COX enzymes -> PGE2 down -> set point returns toward normal. Infections and some central nervous system disorders can cause fever.","explain_ar":"لو بردان وخبطت برجلك أو صقفت بإيدك لتدفى، ده Voluntary muscle contractions؛ أما الرجفة اللاإرادية فـShivering. في البرد أيضًا قد تزيد الشهية وحرارة معالجة الغذاء SDA، والهرمونات والنشاط السمبثاوي يساهموا في إنتاج الحرارة، خصوصًا على المدى الأطول.\nFever (Pyrexia) مش مجرد حرارة جسم زادت؛ فيه **ارتفاع في Set point**. بكتيريا أو سمومها (Exogenous pyrogens) تنبه Monocytes/Macrophages/Kupffer cells؛ تفرز IL-1 وسيتوكينات؛ يزيد تصنيع PGE2 الذي يرفع نقطة الضبط في Hypothalamus. التسلسل: Pyrogen → Immune cells → IL-1 → PGE2 ↑ → Set point ↑ → Fever. Aspirin يثبط COX فيقل PGE2 فتعود نقطة الضبط نحو الطبيعي.","key_en":"Other cold defenses taught include VOLUNTARY muscular activity (stamping feet or clapping), increased food intake and SDA-related heat production, and sympathetic/thyroid responses that increase heat production, especially with prolonged cold adaptation. The handout emphasizes protein's SDA (~30% in the previous lecture).\nFEVER (PYREXIA) is a REGULATED increase in body temperature due to a rise in the HYPOTHALAMIC SET POINT. EXOGENOUS PYROGENS such as bacterial endotoxin activate immune cells including monocytes, macrophages and Kupffer cells. These release ENDOGENOUS PYROGENIC CYTOKINES such as IL-1. Inflammatory signals boost PGE2 synthesis in thermoregulatory pathways, and PGE2 raises set point. Pathway: PYROGEN -> IMMUNE CELLS -> IL-1 -> PGE2 -> SET POINT UP -> FEVER. Aspirin and similar ANTIPYRETICS inhibit COX enzymes -> PGE2 down -> set point returns toward normal. Infections and some central nervous system disorders can cause fever."},{"page":54,"title":"Stages of fever and heat stroke","body":"CHILLS STAGE: the PGE2-driven set point rises (e.g. 37 -> 39 C) while actual temperature is still lower (37 C), so a patient FEELS COLD and shivers; skin vasoconstricts to conserve warmth and actual temperature rises. CRISIS / FLUSH STAGE: pyrogens resolve or antipyretics lower set point toward 37 C while actual core temperature may remain 39 C; the body FEELS HOT and responds with SWEATING and SKIN VASODILATION. Chills = Shivering + Vasoconstriction; Crisis = Sweating + Vasodilation.\nHEAT STROKE is a life-threatening HYPERTHERMIA syndrome with CNS dysfunction (e.g. confusion, collapse). It results from excess heat load or failed heat dissipation, usually WITHOUT A HIGHER THERMOSTAT SET POINT. It may follow exertion even in weather below 42 C; heat-related cellular injury can develop at high core temperatures, but there is no safe temperature cutoff. ANTIPYRETICS are ineffective because PGE2-driven set point is not the problem. Immediate RAPID COOLING and EMERGENCY MEDICAL CARE are required. Crucial distinction: FEVER = set point raised; HEAT STROKE = heat accumulation with unchanged set point.","explain_ar":"في بداية Fever يحصل Chills: الـSet point يتغير من 37 إلى 39 بينما الحرارة الفعلية ما زالت 37؛ المخ يحس إن الجسم بارد بالنسبة للهدف الجديد فيعمل Shivering + Vasoconstriction، فتزيد الحرارة. عند التحسن Crisis/Flush: نقطة الضبط تعود إلى 37 لكن الجسم لا يزال 39؛ فيعمل Sweating + Vasodilation، فتحس بالحرارة ويبدأ الجسم يبرد. السر هو مقارنة القيمة الفعلية بالمرجعية، مش مجرد رقم حرارة مرتفع.\nHeat stroke ضربة حرارة خطيرة مع خلل الجهاز العصبي المركزي بسبب حمل حراري كبير وعدم قدرة الجسم على تبديد الحرارة، غالبًا من غير ارتفاع Set point. خافض الحرارة مثل Aspirin لا يصلحها لأن COX/PGE2 مش أساس المشكلة. تحتاج تبريدًا سريعًا ومساعدة إسعافية فورية. الإصابة ممكن تحصل قبل 42°C؛ لا تعتمد على رقم واحد لاستبعادها.","key_en":"CHILLS STAGE: the PGE2-driven set point rises (e.g. 37 -> 39 C) while actual temperature is still lower (37 C), so a patient FEELS COLD and shivers; skin vasoconstricts to conserve warmth and actual temperature rises. CRISIS / FLUSH STAGE: pyrogens resolve or antipyretics lower set point toward 37 C while actual core temperature may remain 39 C; the body FEELS HOT and responds with SWEATING and SKIN VASODILATION. Chills = Shivering + Vasoconstriction; Crisis = Sweating + Vasodilation.\nHEAT STROKE is a life-threatening HYPERTHERMIA syndrome with CNS dysfunction (e.g. confusion, collapse). It results from excess heat load or failed heat dissipation, usually WITHOUT A HIGHER THERMOSTAT SET POINT. It may follow exertion even in weather below 42 C; heat-related cellular injury can develop at high core temperatures, but there is no safe temperature cutoff. ANTIPYRETICS are ineffective because PGE2-driven set point is not the problem. Immediate RAPID COOLING and EMERGENCY MEDICAL CARE are required. Crucial distinction: FEVER = set point raised; HEAT STROKE = heat accumulation with unchanged set point."}]},"counts":{"N":{"Definition":47,"Scientific Term":47,"Complete":38,"Mention":16},"E":{"Definition":23,"Scientific Term":25,"Mention":18,"Complete":40},"F":{"Definition":58,"Scientific Term":58,"Complete":49,"Mention":38},"T":{"Definition":39,"Scientific Term":39,"Complete":43,"Mention":32}},"version":"2-ar-en-mcqs","questionCount":610}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('data').textContent);
const lectures=DATA.lectures, questions=DATA.questions, summaries=DATA.summaries;
const tnames={'Complete':'Complete','Definition':'Definition','Scientific Term':'Scientific Term','Mention':'Mention'};
let mode='summary', selected='N', questionIndex=0, exam=[], history=[], score=0, answered=false;
const app=document.getElementById('app');
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function pickLecture(key){selected=key; exam=[];history=[];score=0;questionIndex=0;answered=false;pickedChoice=-1;render();window.scrollTo({top:0,behavior:'smooth'});}
function setTab(t){mode=t;document.getElementById('summaryTab').classList.toggle('active',t==='summary');document.getElementById('examTab').classList.toggle('active',t==='exam');render();}
function buttons(){const ids=mode==='summary'?['N','E','F','T']:['N','E','F','T','ALL'];const names={N:'⚡ Nerve Physiology',E:'🔥 Energy, BMR & SDA',F:'🍽️ Food Intake',T:'🌡️ Thermoregulation',ALL:'📚 Comprehensive Exam'};return `<div class="chips">${ids.map(k=>`<button type="button" class="${selected===k?'active':''}" onclick="pickLecture('${k}')">${names[k]}</button>`).join('')}</div>`;}
function stats(key){const ct=key==='ALL'?questions:questions.filter(z=>z.lecture===key);return `<div class="overview">${['Complete','Definition','Scientific Term','Mention'].map(k=>`<div class="stat"><strong>${ct.filter(x=>x.type===k).length}</strong><span>${k}</span></div>`).join('')}</div>`}
function renderSummary(){if(selected==='ALL')selected='N';const meta=lectures[selected];app.innerHTML=buttons()+`<section class="panel"><h2>${meta.emoji} ${esc(meta.title)}</h2><div class="meta"><span class="tag">📄 Pages ${esc(meta.pages)}</span><span class="tag">شرح بالعربي + English exam notes</span></div><p class="intro" dir="rtl">شرح بالمصري علشان تفهم المعلومة، وتحته المصطلحات والتفاصيل بالإنجليزي علشان تعرف تصيغ الإجابة في الامتحان. مرتب حسب صفحات المحاضرة.</p><div class="toolbar"><button class="btn outline" onclick="window.print()">🖨️ طباعة الملخص</button><button class="btn secondary" onclick="setTab('exam')">ابدأ امتحان</button></div>${(summaries[selected]||[]).map(z=>`<article class="summary-page"><h3>Page ${z.page} — ${esc(z.title)}</h3><div class="explain"><div class="block-label">💡 افهمها بالمصري</div>${(z.explain_ar||'').split('\n').filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('')}</div><div class="en-notes"><div class="block-label en">📘 English terminology & exam essentials</div>${(z.key_en||z.body||'').split('\n').filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('')}</div></article>`).join('')}</section>`}
function seededShuffle(x){const a=x.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildExam(){const pool=selected==='ALL'?questions:questions.filter(x=>x.lecture===selected),pattern=[['Complete',2],['Definition',2],['Scientific Term',2],['Mention',3]];exam=[];for(const [type,n] of pattern){const arr=seededShuffle(pool.filter(z=>z.type===type));exam.push(...arr.slice(0,n));}exam=seededShuffle(exam).map(x=>{const q={...x};const c=seededShuffle(x.choices);q.choices=c;q.correctIndex=c.indexOf(x.answer);return q;});questionIndex=0;history=[];score=0;answered=false;pickedChoice=-1;renderExam();}
let pickedChoice=-1;
function selectChoice(i){if(answered)return;pickedChoice=i;document.querySelectorAll('.choice').forEach((b,j)=>b.classList.toggle('selected',j===i));document.getElementById('checkButton').disabled=false;}
function renderExam(){const meta=selected==='ALL'?{title:'Comprehensive Exam',emoji:'📚',pages:'all 4 lectures'}:lectures[selected];let head=buttons()+`<section class="panel"><h2>${meta.emoji} ${esc(meta.title)}</h2><div class="meta"><span class="tag">📄 ${esc(meta.pages)}</span><span class="tag">9 MCQs = 9 marks</span><span class="tag">4 challenging answers each</span></div>`;
 if(!exam.length){app.innerHTML=head+`<p class="intro" dir="rtl">كل اختبار 9 أسئلة عشوائية من نفس بنك أسئلة PDF، لكن الأربع صيغ كلها أصبحت اختياري بأربع إجابات متقاربة. اضغط على الاختيار وبعدين «تصحيح» علشان تعرف صح أو غلط فورًا، وفي النهاية هتشوف إجابات الأسئلة التسعة كلها.</p><div class="steps"><div class="step"><b>2</b><small>Complete</small></div><div class="step"><b>2</b><small>Definition</small></div><div class="step"><b>2</b><small>Scientific term</small></div><div class="step"><b>3</b><small>Mention</small></div></div>${stats(selected)}<div class="toolbar"><button class="btn" onclick="buildExam()">ابدأ امتحان اختياري جديد ←</button></div><p class="print-hint">تم تحويل جميع الأسئلة إلى اختيار من متعدد، مع الحفاظ على نوع السؤال الأصلي. لا توجد إجابات كتابية.</p></section>`;return;}
 if(questionIndex>=exam.length){const review=history.map((h,i)=>`<article class="reviewitem"><span class="tag">${i+1} / ${h.item.type} · P.${h.item.page}</span><h3 class="lhs">${esc(h.item.question)}</h3><div class="choice-review your"><b>Your choice (${h.userIndex>=0?'ABCD'[h.userIndex]:'—'}):</b> ${h.userIndex>=0?esc(h.item.choices[h.userIndex]):'—'}</div><div class="choice-review answerkey"><b>Correct (${ 'ABCD'[h.item.correctIndex] }):</b> ${esc(h.item.answer)}</div><div class="sub">${h.good?'✅ Correct':'❌ Incorrect'}</div></article>`).join('');app.innerHTML=head+`<div class="score">${score} / 9</div><p class="intro" dir="rtl">خلصت الامتحان! دي مراجعة الأسئلة التسعة كلها، باختيارك والإجابة الصح. جرّب امتحان جديد بترتيب وأسئلة مختلفة.</p><div class="toolbar"><button class="btn" onclick="buildExam()">🔄 امتحان عشوائي جديد</button><button class="btn secondary" onclick="window.print()">🖨️ طباعة النتيجة</button></div><h3>مراجعة الامتحان كاملًا</h3>${review}</section>`;return;}
 const q=exam[questionIndex];const done=history.length;app.innerHTML=head+`<div class="q-top"><span class="tag">Question ${questionIndex+1} / 9</span><span class="tag">${esc(q.type)} · Page ${q.page}</span></div><div class="progressbar"><i style="width:${Math.round(done/9*100)}%"></i></div><div class="question">${esc(q.question)}</div><div class="choice-list" role="group" aria-label="Choose one answer">${q.choices.map((s,j)=>`<button class="choice" type="button" onclick="selectChoice(${j})"><span class="letter">${'ABCD'[j]}</span><span class="content">${esc(s)}</span></button>`).join('')}</div><div id="answerFeedback"></div><div class="toolbar"><button id="checkButton" class="btn" disabled onclick="checkAnswer()">تصحيح الإجابة</button><button id="skipButton" class="btn secondary" onclick="skipAnswer()">مش فاكر / إظهار الحل</button></div></section>`;
}
function checkAnswer(skip=false){if(answered)return;if(pickedChoice<0&&!skip)return;const q=exam[questionIndex];const ix=skip?-1:pickedChoice;const good=ix===q.correctIndex;answered=true;history.push({item:q,userIndex:ix,good});if(good)score++;document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.correctIndex)b.classList.add('correct');if(j===ix&&j!==q.correctIndex)b.classList.add('incorrect');});document.getElementById('checkButton').disabled=true;document.getElementById('skipButton').disabled=true;renderFeedback();}
function skipAnswer(){checkAnswer(true)}
function renderFeedback(){const h=history[history.length-1];const q=h.item;document.getElementById('answerFeedback').innerHTML=`<div class="feedback ${h.good?'good':'bad'}"><strong>${h.good?'✅ صح!':'❌ مش صح؛ راجع الإجابة'}</strong><div class="arabic">الإجابة الصحيحة هي الاختيار <b>${'ABCD'[q.correctIndex]}</b>:</div><div class="model">${esc(q.answer)}</div></div><button class="btn" type="button" onclick="nextQuestion()">${questionIndex===8?'عرض الدرجة ومراجعة كل الأسئلة':'السؤال التالي ←'}</button>`;}
function nextQuestion(){questionIndex++;answered=false;pickedChoice=-1;renderExam();}
function render(){if(mode==='summary')renderSummary();else renderExam();}
render();
</script>
</body>
</html>
