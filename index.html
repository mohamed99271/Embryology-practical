ility."],"correctIndex":3},{"lecture":"N","type":"Definition","page":25,"question":"Define: Contiguous conduction.","answer":"Propagation of action potentials from one adjacent membrane region to the next in an unmyelinated nerve fiber.","source":"previously authored exam bank","id":"N-D-0034","choices":["The gate of a voltage-gated sodium channel that is closed at rest and opens rapidly during depolarization.","An after-potential described in these notes as briefly less negative than RMP and associated with increased excitability.","Propagation of action potentials from one adjacent membrane region to the next in an unmyelinated nerve fiber.","Propagation of action potentials to one adjacent membrane region to the next in an unmyelinated nerve fiber."],"correctIndex":2},{"lecture":"N","type":"Scientific Term","page":25,"question":"Voltage-sensitive channels responsible for rapid sodium entry during the rising phase of an AP.","answer":"Voltage-gated Na+ channels","source":"previously authored exam bank","id":"N-S-0075","choices":["Voltage-gated Na+ channels","Contiguous conduction","Na+ activation gate","Na+ inactivation gate"],"correctIndex":0},{"lecture":"N","type":"Scientific Term","page":25,"question":"The sodium-channel gate that opens quickly when the membrane depolarizes.","answer":"Na+ activation gate","source":"previously authored exam bank","id":"N-S-0076","choices":["Positive after-potential (lecture terminology)","Voltage-gated Na+ channels","Na+ inactivation gate","Na+ activation gate"],"correctIndex":3},{"lecture":"N","type":"Scientific Term","page":25,"question":"The sodium-channel gate that closes near the AP peak to limit sodium entry.","answer":"Na+ inactivation gate","source":"previously authored exam bank","id":"N-S-0077","choices":["Contiguous conduction","Na+ inactivation gate","Na+ activation gate","Voltage-gated Na+ channels"],"correctIndex":1},{"lecture":"N","type":"Scientific Term","page":25,"question":"In these lecture notes, the after-potential with membrane voltage less negative than rest and greater excitability.","answer":"Negative after-potential (lecture terminology)","source":"previously authored exam bank","id":"N-S-0079","choices":["Negative after-potential (lecture terminology)","Voltage-gated Na+ channels","Na+ activation gate","Positive after-potential (lecture terminology)"],"correctIndex":0},{"lecture":"N","type":"Scientific Term","page":25,"question":"In these lecture notes, the after-potential that makes membrane voltage more negative than RMP.","answer":"Positive after-potential (lecture terminology)","source":"previously authored exam bank","id":"N-S-0080","choices":["Na+ inactivation gate","Na+ activation gate","Negative after-potential (lecture terminology)","Positive after-potential (lecture terminology)"],"correctIndex":3},{"lecture":"N","type":"Scientific Term","page":25,"question":"The slower, successive spread of an AP along every adjacent region of an unmyelinated fiber.","answer":"Contiguous conduction","source":"previously authored exam bank","id":"N-S-0081","choices":["Myelin sheath","Contiguous conduction","Saltatory conduction","Nodes of Ranvier"],"correctIndex":1},{"lecture":"N","type":"Complete","page":25,"question":"At rest, the Na+ activation gate is ________ and its inactivation gate is ________.","answer":"closed; open","source":"previously authored exam bank","id":"N-C-0119","choices":["closed; closed","open; closed","closed; open","open; open"],"correctIndex":2},{"lecture":"N","type":"Complete","page":25,"question":"Near the AP peak, the Na+ ________ gate closes to stop entry.","answer":"inactivation","source":"previously authored exam bank","id":"N-C-0120","choices":["potassium","activation","resting","inactivation"],"correctIndex":3},{"lecture":"N","type":"Complete","page":25,"question":"According to the handout, the ________ after-potential is less negative and more excitable.","answer":"negative","source":"previously authored exam bank","id":"N-C-0121","choices":["positive","negative","relative","hyperpolarizing"],"correctIndex":1},{"lecture":"N","type":"Complete","page":25,"question":"According to the handout, the ________ after-potential is more negative and less excitable.","answer":"positive","source":"previously authored exam bank","id":"N-C-0122","choices":["depolarizing","supernormal","positive","negative"],"correctIndex":2},{"lecture":"N","type":"Complete","page":25,"question":"Conduction in unmyelinated fibers is called ________ conduction.","answer":"contiguous","source":"previously authored exam bank","id":"N-C-0123","choices":["internodal","electrotonic","saltatory","contiguous"],"correctIndex":3},{"lecture":"N","type":"Mention","page":25,"question":"State the states of BOTH Na+ gates at rest, during depolarization, and at the AP peak.","answer":"Rest: activation closed/inactivation open; depol: both open briefly; peak: inactivation closed while activation may still be open.","source":"previously authored exam bank","id":"N-M-0142","choices":["Rest: inactivation closed/inactivation open; depol: both open briefly; peak: inactivation closed while activation may still be open.","Rest: activation closed/inactivation open; depol: both open briefly; peak: inactivation closed while activation may still be open.","Rest: activation open/inactivation open; depol: both open briefly; peak: inactivation closed while activation may still be open.","Rest: activation closed/activation open; depol: both open briefly; peak: inactivation closed while activation may still be open."],"correctIndex":1},{"lecture":"N","type":"Mention","page":25,"question":"Enumerate the two after-potentials and indicate excitability in the lecture terminology.","answer":"Negative after-potential: less negative, increased excitability; positive after-potential (hyperpolarization): more negative, decreased excitability.","source":"previously authored exam bank","id":"N-M-0143","choices":["Negative before-potential: less negative, increased excitability; positive after-potential (hyperpolarization): more negative, decreased excitability.","positive after-potential: less negative, increased excitability; positive after-potential (hyperpolarization): more negative, decreased excitability.","Negative after-potential: less negative, increased excitability; positive after-potential (hyperpolarization): more negative, decreased excitability.","Negative after-potential: less negative, increased excitability; negative after-potential (hyperpolarization): more negative, decreased excitability."],"correctIndex":2},{"lecture":"N","type":"Mention","page":25,"question":"Mention the two modes of impulse conduction and the fiber types where each occurs.","answer":"Contiguous in unmyelinated fibers; saltatory in myelinated fibers.","source":"previously authored exam bank","id":"N-M-0144","choices":["Contiguous in unmyelinated fibers; saltatory in myelinated fibers.","Contiguous in unmyelinated fibers; continuous in myelinated fibers.","Contiguous in unmyelinated fibers; retrograde in myelinated fibers.","Contiguous in unmyelinated fibers; contiguous in myelinated fibers."],"correctIndex":0},{"lecture":"N","type":"Definition","page":26,"question":"Define: Saltatory conduction.","answer":"Rapid conduction in a myelinated axon in which action potentials are regenerated at the nodes of Ranvier.","source":"previously authored exam bank","id":"N-D-0035","choices":["The ability of living tissue to respond to a stimulus and generate an action potential.","Rapid conduction in a myelinated axon in which action potentials are regenerated at the nodes of Ranvier.","Rapid convection in a myelinated axon in which action potentials are regenerated at the nodes of Ranvier.","The period during which no stimulus, however strong, can evoke another action potential."],"correctIndex":1},{"lecture":"N","type":"Definition","page":26,"question":"Define: Excitability.","answer":"The ability of living tissue to respond to a stimulus and generate an action potential.","source":"previously authored exam bank","id":"N-D-0036","choices":["Rapid conduction in a myelinated axon in which action potentials are regenerated at the nodes of Ranvier.","The ability of living tissue to respond to a stimulus and generate an action potential.","The period during which no stimulus, however strong, can evoke another action potential.","The relationship between stimulus strength and the duration required to produce a response in excitable tissue."],"correctIndex":1},{"lecture":"N","type":"Definition","page":26,"question":"Define: Absolute refractory period (ARP).","answer":"The period during which no stimulus, however strong, can evoke another action potential.","source":"previously authored exam bank","id":"N-D-0037","choices":["The period during which no stimulus, however strong, can evoke another action potential.","The ability of living tissue to respond to a stimulus and generate an action potential.","The period after which no stimulus, however strong, can evoke another action potential.","Rapid conduction in a myelinated axon in which action potentials are regenerated at the nodes of Ranvier."],"correctIndex":0},{"lecture":"N","type":"Scientific Term","page":26,"question":"Rapid conduction in myelinated fibers with AP regeneration at the nodes of Ranvier.","answer":"Saltatory conduction","source":"previously authored exam bank","id":"N-S-0082","choices":["Myelin sheath","Saltatory conduction","Contiguous conduction","Nodes of Ranvier"],"correctIndex":1},{"lecture":"N","type":"Scientific Term","page":26,"question":"The ability of nerve or muscle tissue to respond to stimulation by generating an AP.","answer":"Excitability","source":"previously authored exam bank","id":"N-S-0083","choices":["Contiguous conduction","Excitability","Saltatory conduction","Absolute refractory period (ARP)"],"correctIndex":1},{"lecture":"N","type":"Scientific Term","page":26,"question":"The period after AP initiation when a second AP cannot be generated even by a very strong stimulus.","answer":"Absolute refractory period (ARP)","source":"previously authored exam bank","id":"N-S-0084","choices":["Absolute refractory period (ARP)","Saltatory conduction","Relative refractory period (RRP)","Excitability"],"correctIndex":0},{"lecture":"N","type":"Complete","page":26,"question":"Action potentials are regenerated at the ________ during saltatory conduction.","answer":"nodes of Ranvier","source":"previously authored exam bank","id":"N-C-0124","choices":["Schwann cells","internodal membranes","axon terminals","nodes of Ranvier"],"correctIndex":3},{"lecture":"N","type":"Complete","page":26,"question":"________ conduction is faster and more energy efficient than contiguous conduction.","answer":"Saltatory","source":"previously authored exam bank","id":"N-C-0125","choices":["passive","contiguous","retrograde","Saltatory"],"correctIndex":3},{"lecture":"N","type":"Complete","page":26,"question":"During the absolute refractory period, another AP ________ be triggered by any stimulus.","answer":"cannot","source":"previously authored exam bank","id":"N-C-0126","choices":["must","cannot","may always","can"],"correctIndex":1},{"lecture":"N","type":"Mention","page":26,"question":"State two advantages of saltatory conduction.","answer":"Higher conduction velocity; energy conservation.","source":"previously authored exam bank","id":"N-M-0145","choices":["Higher conduction velocity; energy conservation.","Absolute refractory; energy conservation.","Higher convection velocity; energy conservation.","lower conduction velocity; energy conservation."],"correctIndex":0},{"lecture":"N","type":"Mention","page":26,"question":"Enumerate the four excitability phases studied in this lecture.","answer":"Absolute refractory; relative refractory; supernormal; subnormal.","source":"previously authored exam bank","id":"N-M-0146","choices":["supernormal refractory; relative refractory; supernormal; subnormal.","Absolute refractory; relative refractory; supernormal; subnormal.","relative refractory; relative refractory; supernormal; subnormal.","subnormal refractory; relative refractory; supernormal; subnormal."],"correctIndex":1},{"lecture":"N","type":"Definition","page":27,"question":"Define: Relative refractory period (RRP).","answer":"The period when another action potential can occur, but only with a stronger-than-normal stimulus.","source":"previously authored exam bank","id":"N-D-0038","choices":["A period in which tissue excitability is higher than normal and a weaker-than-usual stimulus may be effective.","The period when another action potential can occur, but only with a stronger-than-normal stimulus.","A period in which tissue excitability is lower than normal and a stronger stimulus may be needed.","The period when another action potential can occur, but only with a weaker-than-normal stimulus."],"correctIndex":1},{"lecture":"N","type":"Definition","page":27,"question":"Define: Supernormal phase.","answer":"A period in which tissue excitability is higher than normal and a weaker-than-usual stimulus may be effective.","source":"previously authored exam bank","id":"N-D-0039","choices":["A period in which tissue excitability is lower than normal and a stronger stimulus may be needed.","A period in which tissue excitability is higher than normal and a stronger-than-usual stimulus may be effective.","A period in which tissue excitability is lower than normal and a weaker-than-usual stimulus may be effective.","A period in which tissue excitability is higher than normal and a weaker-than-usual stimulus may be effective."],"correctIndex":3},{"lecture":"N","type":"Definition","page":27,"question":"Define: Subnormal phase.","answer":"A period in which tissue excitability is lower than normal and a stronger stimulus may be needed.","source":"previously authored exam bank","id":"N-D-0040","choices":["A period in which tissue excitability is lower than normal and a weaker stimulus may be needed.","A period in which tissue excitability is higher than normal and a stronger stimulus may be needed.","A period in which tissue excitability is lower than normal and a stronger stimulus may be needed.","A period in which tissue excitability is higher than normal and a weaker-than-usual stimulus may be effective."],"correctIndex":2},{"lecture":"N","type":"Definition","page":27,"question":"Define: High extracellular Ca2+ effect.","answer":"An increase in extracellular Ca2+ that stabilizes excitable membranes and reduces nerve excitability.","source":"previously authored exam bank","id":"N-D-0041","choices":["An increase in extracellular Ca2+ that stabilizes excitable membranes and reduces nerve excitability.","An decrease in extracellular Ca2+ that stabilizes excitable membranes and reduces nerve excitability.","A period in which tissue excitability is lower than normal and a stronger stimulus may be needed.","The relationship between stimulus strength and the duration required to produce a response in excitable tissue."],"correctIndex":0},{"lecture":"N","type":"Definition","page":27,"question":"Define: Local anesthetics.","answer":"Drugs such as procaine and tetracaine that block voltage-gated Na+ channels and inhibit nerve impulse conduction.","source":"previously authored exam bank","id":"N-D-0042","choices":["Drugs such as procaine and tetracaine that block voltage-gated Cl- channels and inhibit nerve impulse conduction.","Drugs such as procaine and tetracaine that block voltage-gated K+ channels and inhibit nerve impulse conduction.","Drugs such as procaine and tetracaine that block voltage-gated Na+ channels and inhibit nerve impulse conduction.","Drugs such as procaine and tetracaine that block voltage-gated Ca2+ channels and inhibit nerve impulse conduction."],"correctIndex":2},{"lecture":"N","type":"Definition","page":27,"question":"Define: Neuromuscular blocking drugs (e.g., curare).","answer":"Agents that block transmission at the neuromuscular junction, preventing effective activation of skeletal muscle.","source":"previously authored exam bank","id":"N-D-0043","choices":["Agents that block transmission at the neuromuscular junction, preventing effective activation of skeletal fat.","Agents that block transmission at the neuromuscular junction, preventing effective inactivation of skeletal muscle.","Drugs such as procaine and tetracaine that block voltage-gated Na+ channels and inhibit nerve impulse conduction.","Agents that block transmission at the neuromuscular junction, preventing effective activation of skeletal muscle."],"correctIndex":3},{"lecture":"N","type":"Definition","page":27,"question":"Define: Strength-duration relationship.","answer":"The relationship between stimulus strength and the duration required to produce a response in excitable tissue.","source":"previously authored exam bank","id":"N-D-0044","choices":["The relationship between stimulus strength and the duration required to produce a response in excitable tissue.","The time needed by a stimulus of rheobase strength to produce a response, as defined in the notes.","The minimum time needed by a stimulus at twice rheobase strength to produce a response.","A period in which tissue excitability is lower than normal and a stronger stimulus may be needed."],"correctIndex":0},{"lecture":"N","type":"Definition","page":27,"question":"Define: Rheobase.","answer":"The minimum stimulus strength below which no response occurs, however long the stimulus is applied.","source":"previously authored exam bank","id":"N-D-0045","choices":["The relationship between stimulus strength and the duration required to produce a response in excitable tissue.","The minimum time needed by a stimulus at twice rheobase strength to produce a response.","The time needed by a stimulus of rheobase strength to produce a response, as defined in the notes.","The minimum stimulus strength below which no response occurs, however long the stimulus is applied."],"correctIndex":3},{"lecture":"N","type":"Definition","page":27,"question":"Define: Utilization time.","answer":"The time needed by a stimulus of rheobase strength to produce a response, as defined in the notes.","source":"previously authored exam bank","id":"N-D-0046","choices":["The relationship between stimulus strength and the duration required to produce a response in excitable tissue.","The minimum time needed by a stimulus at twice rheobase strength to produce a response.","The time needed by a stimulus of rheobase strength to produce a response, as defined in the notes.","The minimum stimulus strength below which no response occurs, however long the stimulus is applied."],"correctIndex":2},{"lecture":"N","type":"Definition","page":27,"question":"Define: Chronaxie.","answer":"The minimum time needed by a stimulus at twice rheobase strength to produce a response.","source":"previously authored exam bank","id":"N-D-0047","choices":["The minimum time needed by a stimulus at half rheobase strength to produce a response.","The minimum time needed by a stimulus at twice rheobase strength to produce a response.","The time needed by a stimulus of rheobase strength to produce a response, as defined in the notes.","The relationship between stimulus strength and the duration required to produce a response in excitable tissue."],"correctIndex":1},{"lecture":"N","type":"Scientific Term","page":27,"question":"The recovery period when an above-normal stimulus is needed to produce another AP.","answer":"Relative refractory period (RRP)","source":"previously authored exam bank","id":"N-S-0085","choices":["Relative refractory period (RRP)","Supernormal phase","Subnormal phase","Absolute refractory period"],"correctIndex":0},{"lecture":"N","type":"Scientific Term","page":27,"question":"The phase during which excitability exceeds normal and a weaker stimulus may cause a response.","answer":"Supernormal phase","source":"previously authored exam bank","id":"N-S-0086","choices":["Subnormal phase","Absolute refractory period","Relative refractory period (RRP)","Supernormal phase"],"correctIndex":3},{"lecture":"N","type":"Scientific Term","page":27,"question":"The phase during which tissue excitability is below normal.","answer":"Subnormal phase","source":"previously authored exam bank","id":"N-S-0087","choices":["Absolute refractory period","Supernormal phase","Relative refractory period (RRP)","Subnormal phase"],"correctIndex":3},{"lecture":"N","type":"Scientific Term","page":27,"question":"An ionic condition that reduces nerve excitability by making Na+ channel activation more difficult.","answer":"High extracellular Ca2+ effect","source":"previously authored exam bank","id":"N-S-0088","choices":["Local anesthetics","High extracellular Ca2+ effect","Subnormal phase","Neuromuscular blocking drugs (e.g., curare)"],"correctIndex":1},{"lecture":"N","type":"Scientific Term","page":27,"question":"Drugs including procaine and tetracaine that reduce conduction by blocking Na+ channels.","answer":"Local anesthetics","source":"previously authored exam bank","id":"N-S-0089","choices":["High extracellular Ca2+ effect","Supernormal phase","Neuromuscular blocking drugs (e.g., curare)","Local anesthetics"],"correctIndex":3},{"lecture":"N","type":"Scientific Term","page":27,"question":"Agents such as curare that prevent nerve impulses from effectively activating skeletal muscle.","answer":"Neuromuscular blocking drugs (e.g., curare)","source":"previously authored exam bank","id":"N-S-0090","choices":["Local anesthetics","High extracellular Ca2+ effect","Rheobase","Neuromuscular blocking drugs (e.g., curare)"],"correctIndex":3},{"lecture":"N","type":"Scientific Term","page":27,"question":"The curve relating stimulus intensity to the time for which it must be applied to excite tissue.","answer":"Strength-duration relationship","source":"previously authored exam bank","id":"N-S-0091","choices":["Utilization time","Rheobase","Strength-duration relationship","Chronaxie"],"correctIndex":2},{"lecture":"N","type":"Scientific Term","page":27,"question":"The smallest stimulus strength that can excite tissue when applied for a sufficiently long duration.","answer":"Rheobase","source":"previously authored exam bank","id":"N-S-0092","choices":["Rheobase","Chronaxie","Utilization time","Strength-duration curve"],"correctIndex":0},{"lecture":"N","type":"Scientific Term","page":27,"question":"The duration needed for a stimulus at rheobase strength to produce excitation.","answer":"Utilization time","source":"previously authored exam bank","id":"N-S-0093","choices":["Utilization time","Rheobase","Strength-duration curve","Chronaxie"],"correctIndex":0},{"lecture":"N","type":"Scientific Term","page":27,"question":"The time needed for an effective stimulus equal to two times the rheobase intensity.","answer":"Chronaxie","source":"previously authored exam bank","id":"N-S-0094","choices":["Chronaxie","Utilization time","Strength-duration curve","Rheobase"],"correctIndex":0},{"lecture":"N","type":"Complete","page":27,"question":"In the relative refractory period, a ________ than normal stimulus is required.","answer":"stronger","source":"previously authored exam bank","id":"N-C-0127","choices":["equal","stronger","weaker","shorter"],"correctIndex":1},{"lecture":"N","type":"Complete","page":27,"question":"________ excitability means a weaker-than-normal stimulus may work.","answer":"Supernormal","source":"previously authored exam bank","id":"N-C-0128","choices":["Absolute refractory","Relative refractory","Subnormal","Supernormal"],"correctIndex":3},{"lecture":"N","type":"Complete","page":27,"question":"High extracellular ________ tends to lower nerve excitability.","answer":"Ca2+","source":"previously authored exam bank","id":"N-C-0129","choices":["Na+","Ca2+","Cl-","K+"],"correctIndex":1},{"lecture":"N","type":"Complete","page":27,"question":"Procaine and tetracaine inhibit nerve impulse conduction by blocking voltage-gated ________ channels.","answer":"Na+","source":"previously authored exam bank","id":"N-C-0130","choices":["Ca2+","Na+","K+","Cl-"],"correctIndex":1},{"lecture":"N","type":"Complete","page":27,"question":"Curare acts mainly at the ________ junction, preventing effective muscle activation.","answer":"neuromuscular","source":"previously authored exam bank","id":"N-C-0131","choices":["neuromuscular","axon-soma","neuromuscular cleft","synaptic vesicle"],"correctIndex":0},{"lecture":"N","type":"Complete","page":27,"question":"Chronaxie is the time required at ________ times rheobase strength.","answer":"two (2)","source":"previously authored exam bank","id":"N-C-0132","choices":["two (2)","half (0.5)","three (3)","one (1)"],"correctIndex":0},{"lecture":"N","type":"Mention","page":27,"question":"List three factors that reduce nerve/muscle responsiveness described on page 27.","answer":"High extracellular Ca2+; local anesthetics (procaine/tetracaine); neuromuscular blockers (curare, at neuromuscular transmission).","source":"previously authored exam bank","id":"N-M-0147","choices":["High extracellular Ca2+; local anesthetics (procaine/tetracaine); neuromuscular blockers (curare, at neuromuscular transmission).","low extracellular Ca2+; local anesthetics (procaine/tetracaine); neuromuscular blockers (curare, at neuromuscular transmission).","Rheobase; local anesthetics (procaine/tetracaine); neuromuscular blockers (curare, at neuromuscular transmission).","utilization time; local anesthetics (procaine/tetracaine); neuromuscular blockers (curare, at neuromuscular transmission)."],"correctIndex":0},{"lecture":"N","type":"Mention","page":27,"question":"Mention the three terms associated with a strength-duration curve.","answer":"Rheobase; utilization time; chronaxie.","source":"previously authored exam bank","id":"N-M-0148","choices":["Rheobase; utilization time; rheobase.","Rheobase; utilization time; chronaxie.","Rheobase; utilization time; utilization time.","Rheobase; utilization time; refractory period."],"correctIndex":1}, d":"T-C-0565","choices":["hypoglycemia","hyperthermia alone","pyrexia","hypothermia"],"correctIndex":2},{"lecture":"T","type":"Complete","page":53,"question":"The mediator that increases hypothalamic set point in fever is ________.","answer":"PGE2 / prostaglandin E2","source":"lecture photo and tutoring notes","id":"T-C-0566","choices":["CRH","IL-1","PGE2 / prostaglandin E2","COX"],"correctIndex":2},{"lecture":"T","type":"Complete","page":53,"question":"IL-1 is a(n) ________ pyrogenic cytokine.","answer":"endogenous","source":"lecture photo and tutoring notes","id":"T-C-0567","choices":["endogenous","exogenous","neurogenic","cutaneous"],"correctIndex":0},{"lecture":"T","type":"Complete","page":53,"question":"Bacterial endotoxins are ________ pyrogens.","answer":"exogenous","source":"lecture photo and tutoring notes","id":"T-C-0568","choices":["nonpyrogenic","endogenous","thermogenic","exogenous"],"correctIndex":3},{"lecture":"T","type":"Complete","page":53,"question":"Aspirin acts mainly by inhibiting ________ enzymes.","answer":"COX / cyclooxygenase","source":"lecture photo and tutoring notes","id":"T-C-0569","choices":["PGE2","Na+/K+ ATPase","lipase","COX / cyclooxygenase"],"correctIndex":3},{"lecture":"T","type":"Complete","page":53,"question":"Antipyretics reduce hypothalamic ________ synthesis.","answer":"PGE2","source":"lecture photo and tutoring notes","id":"T-C-0570","choices":["acetylcholine","PGE2","thyroxine","CO2"],"correctIndex":1},{"lecture":"T","type":"Mention","page":53,"question":"Mention three additional cold-response pathways on this page.","answer":"Voluntary muscular contractions; increased appetite and SDA; increased thyroid-related and sympathetic responses.","source":"lecture photo and tutoring notes","id":"T-M-0599","choices":["Voluntary muscular contractions; increased satiety and SDA; increased thyroid-related and sympathetic responses.","Voluntary muscular contractions; increased appetite and SDA; increased thyroid-related and sympathetic responses.","Voluntary muscular contractions; increased appetite and SDA; increased thyroid-related and parasympathetic responses.","Monocytes; increased appetite and SDA; increased thyroid-related and sympathetic responses."],"correctIndex":1},{"lecture":"T","type":"Mention","page":53,"question":"Mention the major steps in the molecular mechanism of fever.","answer":"Exogenous pyrogens -> immune cell activation -> IL-1/cytokines -> PGE2 -> hypothalamic set point increase -> fever.","source":"lecture photo and tutoring notes","id":"T-M-0600","choices":["Exogenous pyrogens -> immune cell activation -> IL-1/cytokines -> COX -> hypothalamic set point increase -> fever.","Exogenous pyrogens -> immune cell activation -> IL-1/cytokines -> IL-1 -> hypothalamic set point increase -> fever.","Exogenous pyrogens -> immune cell activation -> IL-1/cytokines -> CRH -> hypothalamic set point increase -> fever.","Exogenous pyrogens -> immune cell activation -> IL-1/cytokines -> PGE2 -> hypothalamic set point increase -> fever."],"correctIndex":3},{"lecture":"T","type":"Mention","page":53,"question":"Mention three cell types capable of producing pyrogenic cytokines.","answer":"Monocytes; tissue macrophages; liver Kupffer cells.","source":"lecture photo and tutoring notes","id":"T-M-0601","choices":["Monocytes; tissue macrophages; Exogenous pyrogens -> immune cell activation -> IL-1/cytokines -> PGE2 -> hypothalamic set point increase -> fever.","Monocytes; tissue macrophages; liver Kupffer cells.","Monocytes; Exogenous pyrogens -> immune cell activation -> IL-1/cytokines -> PGE2 -> hypothalamic set point increase -> fever; liver Kupffer cells.","Exogenous pyrogens -> immune cell activation -> IL-1/cytokines -> PGE2 -> hypothalamic set point increase -> fever; tissue macrophages; liver Kupffer cells."],"correctIndex":1},{"lecture":"T","type":"Mention","page":53,"question":"Mention examples of exogenous and endogenous pyrogens.","answer":"Exogenous: bacterial toxins/endotoxin; endogenous: IL-1 and other inflammatory cytokines.","source":"lecture photo and tutoring notes","id":"T-M-0602","choices":["Exogenous: bacterial toxins/endotoxin; endogenous: PGE2 and other inflammatory cytokines.","Exogenous: bacterial toxins/endotoxin; endogenous: TNF and other inflammatory cytokines.","Exogenous: bacterial toxins/endotoxin; endogenous: COX and other inflammatory cytokines.","Exogenous: bacterial toxins/endotoxin; endogenous: IL-1 and other inflammatory cytokines."],"correctIndex":3},{"lecture":"T","type":"Mention","page":53,"question":"Mention two possible medical causes of fever given in the lecture.","answer":"Bacterial infection; selected brain disorders such as hemorrhage or tumor (may cause central fever).","source":"lecture photo and tutoring notes","id":"T-M-0603","choices":["Bacterial infection; selected brain disorders such as hemorrhage or tumor (may cause central fever).","Bacterial infection; Exogenous pyrogens -> immune cell activation -> IL-1/cytokines -> PGE2 -> hypothalamic set point increase -> fever.","Exogenous pyrogens -> immune cell activation -> IL-1/cytokines -> PGE2 -> hypothalamic set point increase -> fever; selected brain disorders such as hemorrhage or tumor (may cause central fever).","Bacterial infection; selected brain disorders such as hemorrhage or tumor (may cause cutaneous fever)."],"correctIndex":0},{"lecture":"T","type":"Mention","page":53,"question":"Mention how aspirin reduces fever.","answer":"Inhibits COX enzymes -> reduces PGE2 -> hypothalamic set point moves toward normal.","source":"lecture photo and tutoring notes","id":"T-M-0604","choices":["Inhibits COX enzymes -> reduces COX -> hypothalamic set point moves toward normal.","Inhibits COX enzymes -> reduces PGE2 -> hypothalamic set point moves toward normal.","Inhibits COX enzymes -> reduces CRH -> hypothalamic set point moves toward normal.","Inhibits COX enzymes -> reduces IL-1 -> hypothalamic set point moves toward normal."],"correctIndex":1},{"lecture":"T","type":"Definition","page":54,"question":"Define: Chills stage of fever.","answer":"The early fever stage during which the set point rises and shivering with skin vasoconstriction increases core temperature.","source":"lecture photo and tutoring notes","id":"T-D-0524","choices":["The early fever stage during which the set point rises and shivering with skin vasodilation increases core temperature.","The early fever stage during which the set point rises and shivering with skin sweating increases core temperature.","The early fever stage during which the set point rises and shivering with skin convection increases core temperature.","The early fever stage during which the set point rises and shivering with skin vasoconstriction increases core temperature."],"correctIndex":3},{"lecture":"T","type":"Definition","page":54,"question":"Define: Crisis / flush stage of fever.","answer":"The fever-resolution stage when the set point falls and sweating plus skin vasodilation enhance cooling.","source":"lecture photo and tutoring notes","id":"T-D-0526","choices":["The fever-resolution stage when the set point falls and sweating plus skin vasoconstriction enhance cooling.","The fever-resolution stage when the set point falls and sweating plus skin shivering enhance cooling.","The fever-resolution stage when the set point falls and sweating plus skin pilo-erection enhance cooling.","The fever-resolution stage when the set point falls and sweating plus skin vasodilation enhance cooling."],"correctIndex":3},{"lecture":"T","type":"Definition","page":54,"question":"Define: Hyperthermia.","answer":"An abnormally high body temperature arising from excessive heat production or inadequate heat loss without an elevated set point.","source":"lecture photo and tutoring notes","id":"T-D-0528","choices":["An abnormally low body temperature arising from excessive heat production or inadequate heat loss without an elevated set point.","An abnormally high body temperature arising to excessive heat production or inadequate heat loss without an elevated set point.","An abnormally high body temperature arising from excessive heat production or inadequate heat loss without an elevated set point.","The early fever stage during which the set point rises and shivering with skin vasoconstriction increases core temperature."],"correctIndex":2},{"lecture":"T","type":"Definition","page":54,"question":"Define: Heat stroke.","answer":"A life-threatening hyperthermia syndrome with central nervous system dysfunction caused by severe heat stress and impaired cooling.","source":"lecture photo and tutoring notes","id":"T-D-0530","choices":["The fever-resolution stage when the set point falls and sweating plus skin vasodilation enhance cooling.","A life-threatening hyperthermia syndrome with cutaneous nervous system dysfunction caused by severe heat stress and impaired cooling.","Inability to lose heat sufficiently to balance internal and external heat loads.","A life-threatening hyperthermia syndrome with central nervous system dysfunction caused by severe heat stress and impaired cooling."],"correctIndex":3},{"lecture":"T","type":"Definition","page":54,"question":"Define: Heat dissipation failure.","answer":"Inability to lose heat sufficiently to balance internal and external heat loads.","source":"lecture photo and tutoring notes","id":"T-D-0532","choices":["The fever-resolution stage when the set point falls and sweating plus skin vasodilation enhance cooling.","An abnormally high body temperature arising from excessive heat production or inadequate heat loss without an elevated set point.","A life-threatening hyperthermia syndrome with central nervous system dysfunction caused by severe heat stress and impaired cooling.","Inability to lose heat sufficiently to balance internal and external heat loads."],"correctIndex":3},{"lecture":"T","type":"Scientific Term","page":54,"question":"The early fever stage during which the set point rises and shivering with skin vasoconstriction increases core temperature. [Write the scientific term.]","answer":"Chills stage of fever","source":"lecture photo and tutoring notes","id":"T-S-0525","choices":["Crisis / flush stage of fever","Chills stage of fever","Heat stroke","Hyperthermia"],"correctIndex":1},{"lecture":"T","type":"Scientific Term","page":54,"question":"The fever-resolution stage when the set point falls and sweating plus skin vasodilation enhance cooling. [Write the scientific term.]","answer":"Crisis / flush stage of fever","source":"lecture photo and tutoring notes","id":"T-S-0527","choices":["Heat stroke","Crisis / flush stage of fever","Hyperthermia","Chills stage of fever"],"correctIndex":1},{"lecture":"T","type":"Scientific Term","page":54,"question":"An abnormally high body temperature arising from excessive heat production or inadequate heat loss without an elevated set point. [Write the scientific term.]","answer":"Hyperthermia","source":"lecture photo and tutoring notes","id":"T-S-0529","choices":["Chills stage of fever","Hyperthermia","Crisis / flush stage of fever","Heat stroke"],"correctIndex":1},{"lecture":"T","type":"Scientific Term","page":54,"question":"A life-threatening hyperthermia syndrome with central nervous system dysfunction caused by severe heat stress and impaired cooling. [Write the scientific term.]","answer":"Heat stroke","source":"lecture photo and tutoring notes","id":"T-S-0531","choices":["Heat stroke","Crisis (flush) stage","Fever (pyrexia)","Chills stage"],"correctIndex":0},{"lecture":"T","type":"Scientific Term","page":54,"question":"Inability to lose heat sufficiently to balance internal and external heat loads. [Write the scientific term.]","answer":"Heat dissipation failure","source":"lecture photo and tutoring notes","id":"T-S-0533","choices":["Heat dissipation failure","Heat stroke","Crisis / flush stage of fever","Exertional heat stroke"],"correctIndex":0},{"lecture":"T","type":"Scientific Term","page":54,"question":"Heat stroke occurring during heavy physical exertion, sometimes even in moderately hot environmental temperatures. [Write the scientific term.]","answer":"Exertional heat stroke","source":"lecture photo and tutoring notes","id":"T-S-0535","choices":["Exertional heat stroke","Heat stroke","Heat dissipation failure","Chills stage of fever"],"correctIndex":0},{"lecture":"T","type":"Complete","page":54,"question":"During the chills phase the hypothalamic set point ________.","answer":"rises","source":"lecture photo and tutoring notes","id":"T-C-0571","choices":["falls","oscillates below normal","rises","is unchanged"],"correctIndex":2},{"lecture":"T","type":"Complete","page":54,"question":"During chills, shivering and skin ________ raise body temperature.","answer":"vasoconstriction","source":"lecture photo and tutoring notes","id":"T-C-0572","choices":["cutaneous flushing","vasoconstriction","sweating","vasodilation"],"correctIndex":1},{"lecture":"T","type":"Complete","page":54,"question":"When fever resolves, the set point returns toward ________.","answer":"normal","source":"lecture photo and tutoring notes","id":"T-C-0573","choices":["the peak temperature","39°C irrespective of baseline","42°C","normal"],"correctIndex":3},{"lecture":"T","type":"Complete","page":54,"question":"During the crisis/flush phase, sweating and ________ increase heat loss.","answer":"vasodilation","source":"lecture photo and tutoring notes","id":"T-C-0574","choices":["shivering","vasodilation","vasoconstriction","pilo-erection"],"correctIndex":1},{"lecture":"T","type":"Complete","page":54,"question":"The set point remains typically ________ in heat stroke.","answer":"unchanged","source":"lecture photo and tutoring notes","id":"T-C-0575","choices":["unchanged","cyclically reset","decreased","elevated"],"correctIndex":0},{"lecture":"T","type":"Complete","page":54,"question":"A serious high-temperature emergency with altered mental state is called ________.","answer":"heat stroke","source":"lecture photo and tutoring notes","id":"T-C-0576","choices":["simple sweating","fever with chills","mild heat exhaustion","heat stroke"],"correctIndex":3},{"lecture":"T","type":"Complete","page":54,"question":"Dangerous heat stroke can occur without core temperature exceeding ________ degrees C.","answer":"42","source":"lecture photo and tutoring notes","id":"T-C-0578","choices":["39","42","37","40"],"correctIndex":1},{"lecture":"T","type":"Mention","page":54,"question":"Compare chills and crisis phases of fever.","answer":"Chills: raised set point, cold sensation, shivering and vasoconstriction; crisis: falling set point, hot sensation, sweating and vasodilation.","source":"lecture photo and tutoring notes","id":"T-M-0605","choices":["Chills: raised set point, cold sensation, shivering and vasoconstriction; crisis: falling set point, hot sensation, sweating and vasoconstriction.","Chills: raised set point, cold sensation, shivering and vasoconstriction; crisis: falling set point, hot sensation, sweating and pilo-erection.","Chills: raised set point, cold sensation, shivering and vasoconstriction; crisis: falling set point, hot sensation, sweating and vasodilation.","Chills: raised set point, cold sensation, shivering and vasoconstriction; crisis: falling set point, hot sensation, sweating and shivering."],"correctIndex":2},{"lecture":"T","type":"Mention","page":54,"question":"Compare fever and heat stroke by mechanism and set point.","answer":"Fever: pyrogen/PGE2 driven raised set point; heat stroke: severe heat load and impaired cooling, with set point generally unchanged.","source":"lecture photo and tutoring notes","id":"T-M-0606","choices":["Fever: pyrogen/CRH driven raised set point; heat stroke: severe heat load and impaired cooling, with set point generally unchanged.","Fever: pyrogen/PGE2 driven raised set point; heat stroke: severe heat load and impaired cooling, with set point generally unchanged.","Fever: pyrogen/COX driven raised set point; heat stroke: severe heat load and impaired cooling, with set point generally unchanged.","Fever: pyrogen/IL-1 driven raised set point; heat stroke: severe heat load and impaired cooling, with set point generally unchanged."],"correctIndex":1},{"lecture":"T","type":"Mention","page":54,"question":"Mention two characteristic findings in heat stroke.","answer":"Severe hyperthermia; brain/CNS dysfunction or altered mental status.","source":"lecture photo and tutoring notes","id":"T-M-0607","choices":["Severe hyperthermia; brain/CNS dysfunction or altered mental status.","Fever: pyrogen/PGE2 driven raised set point; brain/CNS dysfunction or altered mental status.","Severe hyperthermia; Fever: pyrogen/PGE2 driven raised set point.","heat stroke: severe heat load and impaired cooling, with set point generally unchanged; brain/CNS dysfunction or altered mental status."],"correctIndex":0},{"lecture":"T","type":"Definition","page":55,"question":"Define: Exertional heat stroke.","answer":"Heat stroke occurring during heavy physical exertion, sometimes even in moderately hot environmental temperatures.","source":"lecture photo and tutoring notes","id":"T-D-0534","choices":["Heat stroke occurring during heavy physical exertion, sometimes even in moderately hot environmental temperatures.","Heat stroke occurring during heavy physical exertion, sometimes even in moderately cold environmental temperatures.","Heat stroke occurring during heavy physiological exertion, sometimes even in moderately hot environmental temperatures.","Heat stroke occurring after heavy physical exertion, sometimes even in moderately hot environmental temperatures."],"correctIndex":0},{"lecture":"T","type":"Complete","page":55,"question":"Fever responds to antipyretics, but ________ does not.","answer":"heat stroke","source":"lecture photo and tutoring notes","id":"T-C-0577","choices":["heat stroke","chills","hypothermia","fever"],"correctIndex":0},{"lecture":"T","type":"Mention","page":55,"question":"Mention two risk factors for exertional heat stroke.","answer":"Heavy exertion; hot/humid environment; dehydration; poor acclimatization (any two).","source":"lecture photo and tutoring notes","id":"T-M-0608","choices":["Heavy exertion; hot/humid environment; dehydration; poor acclimatization (any two).","Heavy exertion; cold/humid environment; dehydration; poor acclimatization (any two).","Heavy exertion; hot/humid environment; dehydration; poor acclimatization (any three).","Rapid cooling and immediate emergency medical care; hot/humid environment; dehydration; poor acclimatization (any two)."],"correctIndex":0},{"lecture":"T","type":"Mention","page":55,"question":"Mention why antipyretics are not a treatment for heat stroke.","answer":"Heat stroke is not caused by a PGE2-driven rise in the set point, so antipyretics do not correct heat accumulation.","source":"lecture photo and tutoring notes","id":"T-M-0609","choices":["Heat stroke is not caused by a PGE2-driven rise in the set point, so antipyretics do not correct heat accumulation.","Heat stroke is not caused by a COX-driven rise in the set point, so antipyretics do not correct heat accumulation.","Heat stroke is not caused by a CRH-driven rise in the set point, so antipyretics do not correct heat accumulation.","Heat stroke is not caused by a IL-1-driven rise in the set point, so antipyretics do not correct heat accumulation."],"correctIndex":0},{"lecture":"T","type":"Mention","page":55,"question":"Mention the immediate priorities for suspected heat stroke.","answer":"Rapid cooling and immediate emergency medical care.","source":"lecture photo and tutoring notes","id":"T-M-0610","choices":["Rapid cooling and immediate emergency medical care.","Heavy exertion; hot/humid environment; dehydration; poor acclimatization (any two).","Heat stroke is not caused by a PGE2-driven rise in the set point, so antipyretics do not correct heat accumulation.","Fever: pyrogen/PGE2 driven raised set point; heat stroke: severe heat load and impaired cooling, with set point generally unchanged."],"correctIndex":0}],"summaries":{"N":[{"page":20,"title":"Neuron and nerve fiber","body":"The neuron is the functional unit of the nervous system. Its three major functions are RECEIVING, INTEGRATING and TRANSMITTING information. Dendrites receive incoming signals, the soma/cell body contains the nucleus and integrates input, the axon conducts impulses away from the soma, and axon terminals signal to other cells (usually through neurotransmitter release).\nThe myelin sheath insulates parts of the axon and speeds impulse conduction. In the peripheral nervous system, Schwann cells form myelin. Gaps between adjacent myelinated segments are the nodes of Ranvier. In saltatory conduction, the action potential is regenerated at these nodes. An excitable membrane can respond to adequate stimulation by generating an action potential.","explain_ar":"النيورون هو الخلية العصبية، والوحدة الوظيفية للجهاز العصبي: يستقبل معلومة، يجمعها ويعالجها، وبعدها ينقل إشارة. تخيّل رسالة بتدخل من الـDendrites، توصل للـSoma (جسم الخلية)، ثم يسافر الـNerve impulse على طول الـAxon لحد الـAxon terminals التي تنقلها إلى خلية أخرى. ما تحفظش كلمة Transmitting على إنها إرسال طاقة؛ هي نقل معلومة عصبية.\nالـMyelin sheath غلاف عازل حوالين أجزاء من المحور، وظيفته تسريع التوصيل. خلايا Schwann تصنع المايلين في الجهاز العصبي الطرفي PNS. الفراغات بين الأغلفة اسمها Nodes of Ranvier، وهي نقاط تجدد جهد الفعل. افتكر: Dendrites تستقبل؛ Soma تدمج؛ Axon يوصل؛ Terminals تسلّم الإشارة.","key_en":"The neuron is the functional unit of the nervous system. Its three major functions are RECEIVING, INTEGRATING and TRANSMITTING information. Dendrites receive incoming signals, the soma/cell body contains the nucleus and integrates input, the axon conducts impulses away from the soma, and axon terminals signal to other cells (usually through neurotransmitter release).\nThe myelin sheath insulates parts of the axon and speeds impulse conduction. In the peripheral nervous system, Schwann cells form myelin. Gaps between adjacent myelinated segments are the nodes of Ranvier. In saltatory conduction, the action potential is regenerated at these nodes. An excitable membrane can respond to adequate stimulation by generating an action potential."},{"page":21,"title":"Membrane potential and resting negativity","body":"Membrane potential is the electrical potential difference between the cell interior and exterior. The handout teaches an illustrative resting membrane potential (RMP) of approximately -90 mV in large nerve fibers: the inside is 90 mV more negative than the outside. Resting negativity reflects high permeability to K+ (K+ leaks outward), the electrogenic sodium-potassium pump, and intracellular organic anions such as proteins, phosphates and sulfates.\nThe Na+/K+-ATPase uses ATP to pump 3 Na+ OUT and 2 K+ IN per cycle, making a small direct negative contribution inside, while maintaining the ion gradients needed for K+ leakage. Voltage-gated channels and passive leak channels are different; some leak movement persists at rest. Anions retained in the cytoplasm contribute to negative intracellular charge.","explain_ar":"الـMembrane potential مش فرق الطاقة اللي دخلت وخرجت، إنما فرق الجهد الكهربائي بين داخل الخلية وخارجها. في مثال المحاضرة، RMP = −90 mV: يعني الداخل أكثر سالبية بـ90 ملي فولت. ليه؟ لأن غشاء الخلية في الراحة يسمح للبوتاسيوم الموجب بالخروج أكثر من الصوديوم، وده يترك الداخل أكثر سالبية.\nمضخة Na⁺/K⁺ بتستهلك ATP وتُخرج 3 صوديوم موجبة وتُدخل 2 بوتاسيوم موجبة؛ صافي شحنة موجبة واحدة بتخرج في كل دورة. وفي بروتينات وفوسفات وسلفات سالبة محبوسة نسبيًا داخل الخلية. افتكر إن مضخة الأيونات تحفظ فروق التركيز، بينما تسرب K⁺ عامل أساسي في الجهد السالب وقت الراحة.","key_en":"Membrane potential is the electrical potential difference between the cell interior and exterior. The handout teaches an illustrative resting membrane potential (RMP) of approximately -90 mV in large nerve fibers: the inside is 90 mV more negative than the outside. Resting negativity reflects high permeability to K+ (K+ leaks outward), the electrogenic sodium-potassium pump, and intracellular organic anions such as proteins, phosphates and sulfates.\nThe Na+/K+-ATPase uses ATP to pump 3 Na+ OUT and 2 K+ IN per cycle, making a small direct negative contribution inside, while maintaining the ion gradients needed for K+ leakage. Voltage-gated channels and passive leak channels are different; some leak movement persists at rest. Anions retained in the cytoplasm contribute to negative intracellular charge."},{"page":22,"title":"Ion distributions, gradients and Nernst equilibrium","body":"K+ is more concentrated inside cells and normally tends to diffuse OUT at rest. Na+ is higher outside and tends to diffuse IN. Cl- is usually higher outside and its movement depends on electrochemical conditions. Moving positive charge out leaves the inside more negative. If positive K+ moves inward, the inside becomes less negative.\nThe chemical gradient favors movement from higher toward lower concentration. The electrical gradient attracts opposite charges; together they form the electrochemical gradient. The EQUILIBRIUM POTENTIAL of a single ion is the voltage where electrical and chemical driving forces balance, giving no net ion movement. Nernst equation at 37 C: E_ion (mV) = (61.5/z) log10([ion]outside/[ion]inside). Here z is ionic charge (+1 for Na+ or K+; -1 for Cl-). Nernst concerns ONE ion, not the actual membrane potential resulting from several ions.","explain_ar":"تخيّل جزيئات كتير من البوتاسيوم موجودة جوه الخلية: فرق التركيز يدفع K⁺ للخارج، لكن سالبية الداخل تشده للداخل. الجهد اللي عنده القوتان يتوازنان ولا يحصل تدفق صافٍ لأيون واحد اسمه Equilibrium potential. ده بالضبط اللي بنحسبه بمعادلة Nernst، مش الجهد الكلي الناتج عن كل الأيونات.\nالقانون عند 37°C: Eion = (61.5/z) log₁₀(outside/inside) mV؛ z يعني شحنة الأيون (+1 للصوديوم والبوتاسيوم، −1 للكلوريد). K⁺ أعلى جوه ويميل للخروج؛ Na⁺ أعلى بره ويميل للدخول؛ توزيع Cl⁻ وحركته يتأثران بالتدرج الكهروكيميائي. خروج موجب يزيد سالبية الداخل، ودخول موجب يقللها.","key_en":"K+ is more concentrated inside cells and normally tends to diffuse OUT at rest. Na+ is higher outside and tends to diffuse IN. Cl- is usually higher outside and its movement depends on electrochemical conditions. Moving positive charge out leaves the inside more negative. If positive K+ moves inward, the inside becomes less negative.\nThe chemical gradient favors movement from higher toward lower concentration. The electrical gradient attracts opposite charges; together they form the electrochemical gradient. The EQUILIBRIUM POTENTIAL of a single ion is the voltage where electrical and chemical driving forces balance, giving no net ion movement. Nernst equation at 37 C: E_ion (mV) = (61.5/z) log10([ion]outside/[ion]inside). Here z is ionic charge (+1 for Na+ or K+; -1 for Cl-). Nernst concerns ONE ion, not the actual membrane potential resulting from several ions."},{"page":23,"title":"Action potential, threshold and all-or-none","body":"An action potential is a brief, rapid, transient membrane-potential change in adequately stimulated nerve or muscle. In the handout, RMP is approximately -90 mV, threshold around -55 mV, and the peak may reach approximately +30 to +40 mV. Reaching threshold opens many voltage-gated Na+ channels and launches an action potential. Under the all-or-none law, a full response occurs when threshold is reached; subthreshold depolarization does not trigger a full action potential.\nFor K+, high intracellular concentration produces a NEGATIVE equilibrium potential: chemical diffusion pushes K+ outward, whereas the negative internal voltage pulls it inward. For Na+, the higher external concentration favors entry; its equilibrium potential is positive. The Cl- sign relationship reverses owing to valence -1.","explain_ar":"تخيّل الخلية في الراحة عند −90 mV، ووصلها تنبيه. التنبيه الضعيف ممكن يغيّر الجهد شوية بس من غير Action potential. لو وصلت للـThreshold المذكور في المذكرة (حوالي −55 mV) قنوات صوديوم كثيرة تفتح سريعًا فتبدأ موجة جهد الفعل؛ ده معنى All-or-none: يا إما استجابة كاملة إذا تحقق العتبة، يا إما مفيش جهد فعل كامل.\nالـAction potential تغير كهربائي سريع ومؤقت يسمح بنقل الرسالة العصبية؛ القمة في المثال ممكن توصل +30 إلى +40 mV. جهد اتزان K⁺ سالب لأنه يميل للخروج ويحتاج كهرباء داخلية سالبة تشده للداخل، أما الصوديوم فجهد اتزانه موجب. متخلطش بين Threshold وPeak وRMP.","key_en":"An action potential is a brief, rapid, transient membrane-potential change in adequately stimulated nerve or muscle. In the handout, RMP is approximately -90 mV, threshold around -55 mV, and the peak may reach approximately +30 to +40 mV. Reaching threshold opens many voltage-gated Na+ channels and launches an action potential. Under the all-or-none law, a full response occurs when threshold is reached; subthreshold depolarization does not trigger a full action potential.\nFor K+, high intracellular concentration produces a NEGATIVE equilibrium potential: chemical diffusion pushes K+ outward, whereas the negative internal voltage pulls it inward. For Na+, the higher external concentration favors entry; its equilibrium potential is positive. The Cl- sign relationship reverses owing to valence -1."},{"page":24,"title":"Four phases of the action potential","body":"RESTING: voltage-gated sodium and potassium channels are predominantly closed, while leak channels function and the membrane is negative. DEPOLARIZATION: voltage-gated Na+ activation gates open, Na+ enters, and the interior becomes less negative and may become positive. REPOLARIZATION: Na+ channels become inactivated and voltage-gated K+ channels open, so K+ leaves and the membrane potential moves back toward negative values. HYPERPOLARIZATION: some K+ channels remain open briefly, so continued K+ efflux makes the potential MORE negative than the resting value before recovery.\nRemember: Na+ IN -> more positive; K+ OUT -> more negative; EXTRA K+ OUT -> more negative than rest. The Na+/K+ pump maintains long-term concentration gradients, but voltage-gated ion currents chiefly create the rapid action-potential phases.","explain_ar":"احفظ فيلم جهد الفعل كمشهد متصل: Resting: الغشاء سالب وقنوات الجهد الرئيسية مقفولة. Depolarization: قنوات Na⁺ تفتح والصوديوم يدخل؛ فالسالبية تقل وقد يصبح الداخل موجبًا. Repolarization: قنوات Na⁺ تتعطل مؤقتًا وقنوات K⁺ تفتح؛ والبوتاسيوم يخرج فيرجع الجهد للسالب. Hyperpolarization: بعض قنوات K⁺ تتأخر في الغلق فيخرج K⁺ زيادة، فيصبح الجهد أكثر سالبية من الراحة لفترة بسيطة.\nالمفتاح: Na⁺ IN = أقل سالبية؛ K⁺ OUT = أكثر سالبية. مضخة الصوديوم والبوتاسيوم مهمة لاستمرار فروق التركيز على المدى الطويل، لكنها ليست مصدر الحركة السريعة لقمة جهد الفعل.","key_en":"RESTING: voltage-gated sodium and potassium channels are predominantly closed, while leak channels function and the membrane is negative. DEPOLARIZATION: voltage-gated Na+ activation gates open, Na+ enters, and the interior becomes less negative and may become positive. REPOLARIZATION: Na+ channels become inactivated and voltage-gated K+ channels open, so K+ leaves and the membrane potential moves back toward negative values. HYPERPOLARIZATION: some K+ channels remain open briefly, so continued K+ efflux makes the potential MORE negative than the resting value before recovery.\nRemember: Na+ IN -> more positive; K+ OUT -> more negative; EXTRA K+ OUT -> more negative than rest. The Na+/K+ pump maintains long-term concentration gradients, but voltage-gated ion currents chiefly create the rapid action-potential phases."},{"page":25,"title":"Sodium-channel gates, after-potentials and impulse spread","body":"A voltage-gated Na+ channel has ACTIVATION and INACTIVATION gates. At REST: activation is closed, inactivation open. During DEPOLARIZATION: activation opens rapidly; both gates are permissive so Na+ enters. Near PEAK: inactivation closes, ending Na+ entry. On recovery, activation closes and inactivation gate resets.\nThe lecture labels the less-negative, more-excitable post-spike state as NEGATIVE AFTER-POTENTIAL (e.g. -80 vs -90 mV), and a more-negative, less-excitable phase as POSITIVE AFTER-POTENTIAL/HYPERPOLARIZATION (e.g. -95 mV). Names are historical and can be confusing. Continued K+ OUT by itself makes the membrane MORE negative, not less.\nCONTIGUOUS conduction occurs in unmyelinated fibers: each adjacent axonal region reaches threshold and fires a new AP, one region after another.","explain_ar":"قناة الصوديوم الحساسة للجهد فيها بوابتان: Activation وInactivation. في الراحة Activation مقفولة وInactivation مفتوحة؛ أثناء بداية Depolarization الاتنين في وضع يسمح بمرور Na⁺؛ عند القمة Inactivation تقفل فتوقف دخوله، وبعد التعافي ترجع القناة جاهزة. ما تعكسش اسم البوابة اللي بتعطل الصوديوم عند القمة.\nفي اصطلاح المحاضرة، Negative after-potential معناها الجهد أقل سالبية (مثلاً −80 بدل −90) فتكون الخلية أقرب للعتبة وأسهل استثارة؛ وPositive after-potential هنا تسمية للـHyperpolarization (−95) فتكون أصعب استثارة. الأسماء مربكة، والأهم الإشارة الكهربائية نفسها. Contiguous conduction يحصل في Axon بدون Myelin؛ الجهد يتجدد جزءًا وراء جزء، لذلك أبطأ.","key_en":"A voltage-gated Na+ channel has ACTIVATION and INACTIVATION gates. At REST: activation is closed, inactivation open. During DEPOLARIZATION: activation opens rapidly; both gates are permissive so Na+ enters. Near PEAK: inactivation closes, ending Na+ entry. On recovery, activation closes and inactivation gate resets.\nThe lecture labels the less-negative, more-excitable post-spike state as NEGATIVE AFTER-POTENTIAL (e.g. -80 vs -90 mV), and a more-negative, less-excitable phase as POSITIVE AFTER-POTENTIAL/HYPERPOLARIZATION (e.g. -95 mV). Names are historical and can be confusing. Continued K+ OUT by itself makes the membrane MORE negative, not less.\nCONTIGUOUS conduction occurs in unmyelinated fibers: each adjacent axonal region reaches threshold and fires a new AP, one region after another."},{"page":26,"title":"Saltatory conduction, excitability and ARP","body":"SALTATORY conduction occurs in MYELINATED fibers. The action potential is regenerated at nodes of Ranvier, and local current moves rapidly under insulating myelin between nodes. This speeds conduction and saves ion-pumping energy. In contrast, CONTIGUOUS conduction is slower and occurs in UNMYELINATED fibers.\nEXCITABILITY is the ability of living excitable tissue to respond to a stimulus and generate an action potential. The ABSOLUTE REFRACTORY PERIOD (ARP) is the time when NO stimulus, however strong, can produce another AP, because many Na+ channels are inactivated and unavailable. Its main significance is to prevent immediate re-excitation during a portion of the impulse.","explain_ar":"Saltatory conduction يحصل في العصب المغطى بالمايلين؛ الإشارة لا تقفز في الهواء، إنما التيار يسري تحت الغلاف والـAction potential يتجدد عند Nodes of Ranvier. لذلك أسرع وأكثر توفيرًا للطاقة من Contiguous في الليف غير المغطى. احفظ: Myelin → Nodes → Saltatory → Fast.\nExcitability هي قدرة النسيج على الاستجابة لمؤثر وتوليد Action potential. Absolute refractory period هي الفترة اللي يستحيل فيها توليد جهد فعل جديد مهما كان المؤثر قوي؛ لأن كثيرًا من قنوات الصوديوم ما زالت Inactivated وغير جاهزة. ارجع للبوابتين عشان تفهم السبب بدل الحفظ الأعمى.","key_en":"SALTATORY conduction occurs in MYELINATED fibers. The action potential is regenerated at nodes of Ranvier, and local current moves rapidly under insulating myelin between nodes. This speeds conduction and saves ion-pumping energy. In contrast, CONTIGUOUS conduction is slower and occurs in UNMYELINATED fibers.\nEXCITABILITY is the ability of living excitable tissue to respond to a stimulus and generate an action potential. The ABSOLUTE REFRACTORY PERIOD (ARP) is the time when NO stimulus, however strong, can produce another AP, because many Na+ channels are inactivated and unavailable. Its main significance is to prevent immediate re-excitation during a portion of the impulse."},{"page":27,"title":"Relative refractory phases, blockers and strength-duration","body":"In the RELATIVE REFRACTORY PERIOD (RRP), a stronger-than-normal stimulus may generate another AP because some Na+ channels have recovered, but excitability is reduced. SUPER-NORMAL phase: excitability above usual, a weaker stimulus may work. SUB-NORMAL phase: excitability below usual and a stronger stimulus is needed.\nHigh extracellular Ca2+ stabilizes excitable membranes and reduces excitability. Local anesthetics such as procaine and tetracaine block voltage-gated Na+ channels. Curare-like neuromuscular blockers prevent effective neuromuscular transmission.\nSTRENGTH-DURATION curve describes how stimulus strength and duration trade off. RHEOBASE: minimum strength below which no stimulus causes excitation even if prolonged. UTILIZATION TIME: time needed at rheobase strength, as described in the course. CHRONAXIE: minimum duration at TWICE rheobase strength needed for a response. Chronaxie helps compare excitability of tissues.","explain_ar":"Relative refractory period مش زي Absolute: هنا ممكن يحصل Action potential تاني لكن محتاج مؤثر أقوى من الطبيعي، لأن بعض قنوات Na⁺ تعافت ولسه الاستثارة أصعب. Supernormal يعني استثارة أعلى من الطبيعي فمؤثر أضعف قد يكفي؛ Subnormal يعني استثارة أقل من الطبيعي. الكالسيوم العالي بره الخلية يقلل الاستثارة، والمخدرات الموضعية مثل Procaine تسد قنوات Na⁺؛ Curare يمنع انتقال الإشارة عند الوصلة العصبية العضلية.\nمنحنى Strength–Duration يربط شدة التنبيه بزمنه. Rheobase أقل شدة مطلوبة مع زمن طويل جدًا؛ Utilization time هو زمن الاستجابة عند شدة Rheobase حسب المذكرة؛ Chronaxie هو الزمن اللازم عند شدة 2 × Rheobase. تذكّر أن Chronaxie زمن، مش قوة.","key_en":"In the RELATIVE REFRACTORY PERIOD (RRP), a stronger-than-normal stimulus may generate another AP because some Na+ channels have recovered, but excitability is reduced. SUPER-NORMAL phase: excitability above usual, a weaker stimulus may work. SUB-NORMAL phase: excitability below usual and a stronger stimulus is needed.\nHigh extracellular Ca2+ stabilizes excitable membranes and reduces excitability. Local anesthetics such as procaine and tetracaine block voltage-gated Na+ channels. Curare-like neuromuscular blockers prevent effective neuromuscular transmission.\nSTRENGTH-DURATION curve describes how stimulus strength and duration trade off. RHEOBASE: minimum strength below which no stimulus causes excitation even if prolonged. UTILIZATION TIME: time needed at rheobase strength, as described in the course. CHRONAXIE: minimum duration at TWICE rheobase strength needed for a response. Chronaxie helps compare excitability of tissues."}],"E":[{"page":34,"title":"Metabolism and its two processes","body":"METABOLISM is the sum of all chemical reactions and energy transformations in the body. ANABOLISM synthesizes larger and more complex molecules (e.g. proteins, fats and glycogen) from smaller substrates and REQUIRES energy. CATABOLISM breaks larger molecules down into smaller molecules and generally RELEASES usable energy. In plain terms: BUILD and USE energy versus BREAK DOWN and RELEASE energy. The processes act together and energy is not literally built or broken.","explain_ar":"Metabolism يعني كل التفاعلات الكيميائية وتحولات الطاقة في الجسم. مش معنى التمثيل الغذائي إن الجسم بيكسر طاقة! هو بيبني وبيكسر مواد. Anabolism مثل بناء بروتين من أحماض أمينية: تجميع وحدات صغيرة لمركب أكبر، وده يحتاج طاقة؛ كعمال البناء لما يبنوا بيت. Catabolism مثل تكسير مغذيات للاستفادة من طاقتها: جزيئات أكبر تتحول لأصغر وتتحرر طاقة ممكن الجسم يستخدمها. القاعدة الذهبية: Build + Uses energy / Break down + Releases energy.","key_en":"METABOLISM is the sum of all chemical reactions and energy transformations in the body. ANABOLISM synthesizes larger and more complex molecules (e.g. proteins, fats and glycogen) from smaller substrates and REQUIRES energy. CATABOLISM breaks larger molecules down into smaller molecules and generally RELEASES usable energy. In plain terms: BUILD and USE energy versus BREAK DOWN and RELEASE energy. The processes act together and energy is not literally built or broken."},{"page":35,"title":"Energy balance and energy in food","body":"ENERGY BALANCE compares dietary energy intake with total expenditure. Positive balance: INTAKE > EXPENDITURE and energy stores increase (may occur in growth or weight gain). Negative balance: EXPENDITURE > INTAKE and reserves decrease (e.g. undernutrition). Neutral balance: approximate equality, stable body energy stores.\nA food CALORIE (capital C) is a kilocalorie (kcal): energy needed to warm 1 kilogram water by 1 C, conventionally from 15 to 16 C. One kcal = 1000 small calories. The handout's heat values in Cal/g are: CARBOHYDRATE physical 4.1, physiological 4.1; FAT physical 9.3, physiological 9.3; PROTEIN physical 5.3, physiological 4.1. Protein has lower physiological value because the body does not completely oxidize its nitrogenous components, and nitrogenous waste is excreted in urine.","explain_ar":"توازن الطاقة بيقارن اللي بتاكله باللي جسمك بيصرفه. Positive لما Intake أكبر من Expenditure؛ الجسم يخزن فائض الطاقة. Negative لما الصرف أكبر من الدخل؛ الجسم يسحب من مخزونه. Neutral لما الاتنين متقاربين على المدى الطويل. ما تربطش Positive بالحالة الصحية الجيدة بالضرورة؛ هو مجرد اتجاه الفرق.\nالسعر الكبير Calorie في الغذاء = 1 kcal = 1000 calorie صغيرة. جدول المحاضرة: الكربوهيدرات 4.1/4.1، الدهون 9.3/9.3، البروتين 4.1/5.3 (Physiological/Physical Cal/g). لماذا البروتين مختلف؟ لأن الجسم لا يؤكسد مركباته النيتروجينية بالكامل، وبيخرج جزء من النواتج في البول؛ فتكون الطاقة المتاحة فعليًا أقل من طاقة الاحتراق الكامل.","key_en":"ENERGY BALANCE compares dietary energy intake with total expenditure. Positive balance: INTAKE > EXPENDITURE and energy stores increase (may occur in growth or weight gain). Negative balance: EXPENDITURE > INTAKE and reserves decrease (e.g. undernutrition). Neutral balance: approximate equality, stable body energy stores.\nA food CALORIE (capital C) is a kilocalorie (kcal): energy needed to warm 1 kilogram water by 1 C, conventionally from 15 to 16 C. One kcal = 1000 small calories. The handout's heat values in Cal/g are: CARBOHYDRATE physical 4.1, physiological 4.1; FAT physical 9.3, physiological 9.3; PROTEIN physical 5.3, physiological 4.1. Protein has lower physiological value because the body does not completely oxidize its nitrogenous components, and nitrogenous waste is excreted in urine."},{"page":36,"title":"Respiratory quotient (RQ)","body":"RQ is the ratio of the volume of CO2 PRODUCED to the volume of O2 CONSUMED during substrate oxidation. RQ = VCO2/VO2. It is dimensionless. Carbohydrate RQ = 1.0 (e.g. glucose: 6 CO2 / 6 O2); fat = 0.7; protein = 0.8; a mixed diet = approximately 0.85; brain = approximately 0.97-0.99 in the handout. Fat oxidation consumes more oxygen relative to CO2 produced, explaining its lower RQ.\nRQ indicates dominant substrate being oxidized and supports indirect calorimetry. The energy equivalent of O2 is heat released per liter of oxygen consumed. RQ rises above 1 during net conversion of carbohydrate to fat or with excess CO2 from hyperventilation/exercise; it may fall with fat-to-carbohydrate conversion or during exercise recovery. Strictly, measured gas-exchange RER can differ from cellular RQ during non-steady-state activity.","explain_ar":"الـRQ نسبة حجم CO₂ الناتج إلى حجم O₂ المستهلك: فوق CO₂ وتحت O₂. لو 7 لتر على 10 لتر = 0.7، وده يشير إلى اعتماد كبير على أكسدة الدهون؛ لأن أكسدتها تتطلب أكسجينًا أكثر نسبيًا لما تطلع من ثاني أكسيد الكربون. الأرقام: Carbohydrates 1.0، Fats 0.7، Protein 0.8، Mixed diet 0.85، Brain حوالي 0.97–0.99 في المذكرة.\nالـRQ يساعدنا نستدل على نوع الوقود المستخدم ونقدّر الحرارة مقابل استهلاك الأكسجين بالـIndirect calorimetry. خلي بالك إن حركة التنفس والرياضة تغيّر نسبة الغازات المقاسة في الزفير RER، وهي مش دائمًا مطابقة تمامًا للـRQ الخلوي.","key_en":"RQ is the ratio of the volume of CO2 PRODUCED to the volume of O2 CONSUMED during substrate oxidation. RQ = VCO2/VO2. It is dimensionless. Carbohydrate RQ = 1.0 (e.g. glucose: 6 CO2 / 6 O2); fat = 0.7; protein = 0.8; a mixed diet = approximately 0.85; brain = approximately 0.97-0.99 in the handout. Fat oxidation consumes more oxygen relative to CO2 produced, explaining its lower RQ.\nRQ indicates dominant substrate being oxidized and supports indirect calorimetry. The energy equivalent of O2 is heat released per liter of oxygen consumed. RQ rises above 1 during net conversion of carbohydrate to fat or with excess CO2 from hyperventilation/exercise; it may fall with fat-to-carbohydrate conversion or during exercise recovery. Strictly, measured gas-exchange RER can differ from cellular RQ during non-steady-state activity."},{"page":37,"title":"Excess RQ, metabolic rate and BMR","body":"The course defines EXCESS RQ as excess CO2 relative to excess O2 during exercise and recovery compared with rest: (CO2_exercise - CO2_rest) / (O2_exercise - O2_rest). It notes near 1 with short carbohydrate-related exercise and below 1 with longer fat use; real respiratory ratios during exercise have additional influences.\nMETABOLIC RATE is energy expenditure per unit time. CALORIMETRY assesses energy expenditure by measuring heat directly or estimating it indirectly via respiratory gases. BASAL METABOLIC RATE (BMR) is the minimum resting rate required for vital functions under standardized basal conditions; older course expression is kcal per square meter of body surface area per hour. Its measurement requires no food intake for at least 12 hours; complete physical and mental rest after restful sleep; and thermally comfortable room conditions around 20-25 C. BMR is not normally measured while asleep.","explain_ar":"Excess RQ في منهجك بيقارن زيادة CO₂ الناتج بزيادة O₂ المستهلك في التمرين والتعافي، بعد طرح قيم الراحة. المثال المبسط: في نشاط قصير يغلب استخدام الكربوهيدرات فتكون النسبة حول 1؛ ومع نشاط أطول يزيد استخدام الدهون فتقل عن 1. لكن العلاقة في الواقع تتأثر أيضًا بالتنفس واللاكتات.\nMetabolic rate يعني كمية الطاقة المصروفة في وحدة الزمن؛ أما BMR فهو الحد الأساسي للطاقة اللازمة لتشغيل القلب والمخ والتنفس وباقي الأعضاء في ظروف محددة. مش بنقيس BMR وإنت نايم، بل صاحي ومستريح نفسيًا وجسديًا بعد نوم جيد، صايم 12 ساعة على الأقل، وفي درجة حرارة مريحة 20–25°C.","key_en":"The course defines EXCESS RQ as excess CO2 relative to excess O2 during exercise and recovery compared with rest: (CO2_exercise - CO2_rest) / (O2_exercise - O2_rest). It notes near 1 with short carbohydrate-related exercise and below 1 with longer fat use; real respiratory ratios during exercise have additional influences.\nMETABOLIC RATE is energy expenditure per unit time. CALORIMETRY assesses energy expenditure by measuring heat directly or estimating it indirectly via respiratory gases. BASAL METABOLIC RATE (BMR) is the minimum resting rate required for vital functions under standardized basal conditions; older course expression is kcal per square meter of body surface area per hour. Its measurement requires no food intake for at least 12 hours; complete physical and mental rest after restful sleep; and thermally comfortable room conditions around 20-25 C. BMR is not normally measured while asleep."},{"page":38,"title":"BMR measurement, significance and normal values","body":"BMR is often measured by INDIRECT CALORIMETRY, estimating hourly energy from O2/CO2 use under basal conditions and dividing by BODY SURFACE AREA (estimated by DuBois chart/formula in the course). It supports assessment of essential energy needs of heart, respiratory system, liver, kidneys and brain.\nThe lecture gives a conventional reference STANDARD ADULT BMR of ~40 kcal/m2/h. CLINICAL DEVIATION (%) = (measured BMR - standard BMR)/standard BMR x100. E.g. 60 vs 40 gives (60-40)/40 x100 = +50%. The handout calls variation within +/-15% around an age- and sex-adjusted reference normal. Age influences BMR: changes with growth and often declines with age as lean muscle mass decreases; one numeric statement for neonatal BMR conflicts with the surrounding prose, so prefer the overall trend and verify any required birth values with instructor.","explain_ar":"بنقيس BMR غالبًا بطريقة Indirect calorimetry: نقيس الغازات التنفسية ونحوّلها لتقدير استهلاك الطاقة في الساعة، ثم نربطه بمساحة سطح الجسم (DuBois chart حسب الكتاب). أهمية القياس إنه يوضح طاقة الوظائف الحيوية بدون تأثيرات كبيرة من الطعام والحركة والانفعال والحرارة.\nالقيمة التعليمية للبالغ ≈40 kcal/m²/hour، والمدى المذكور ±15% من المعيار المناسب للعمر والجنس. لو Measured = 60 وStandard = 40، نسبة الانحراف = (60−40)/40 ×100 = +50%. خليك فاكر ده فرق نسبي مش طرح 20 درجة. وجدول السن فيه رقم يحتاج الانتباه لأنه لا يتسق تمامًا مع وصف ارتفاع BMR في الطفولة.","key_en":"BMR is often measured by INDIRECT CALORIMETRY, estimating hourly energy from O2/CO2 use under basal conditions and dividing by BODY SURFACE AREA (estimated by DuBois chart/formula in the course). It supports assessment of essential energy needs of heart, respiratory system, liver, kidneys and brain.\nThe lecture gives a conventional reference STANDARD ADULT BMR of ~40 kcal/m2/h. CLINICAL DEVIATION (%) = (measured BMR - standard BMR)/standard BMR x100. E.g. 60 vs 40 gives (60-40)/40 x100 = +50%. The handout calls variation within +/-15% around an age- and sex-adjusted reference normal. Age influences BMR: changes with growth and often declines with age as lean muscle mass decreases; one numeric statement for neonatal BMR conflicts with the surrounding prose, so prefer the overall trend and verify any required birth values with instructor."},{"page":39,"title":"Factors that increase or decrease BMR","body":"PHYSIOLOGICAL FACTORS: age, sex, athletic/physical habits, dietary habits, sleep, climate, pregnancy/lactation/menstruation, group differences and anxiety/tension. At comparable body size, people with more lean muscle generally have higher BMR. Sleep can decrease metabolic rate by roughly 10-15% relative to wakeful rest. Cold climates may cause adaptation with increased heat production. Pregnancy and lactation increase energy needs; emotional tension may raise epinephrine output and muscle tone. Protein intake induces a larger thermic response than carbohydrate.\nPATHOLOGICAL INCREASE: hyperthyroidism; hyperpituitarism; hyperadrenalism; fever; anemia/leukemia; heart failure with dyspnea. DECREASE: hypothyroidism; hypopituitarism; hypocorticism; hypothermia; starvation; shock. Illustrative course figures: hyperthyroidism +50 to +100%, hyperpituitarism +15 to +20%, hyperadrenalism about +150%, not universal clinical constants.","explain_ar":"العوامل الفسيولوجية: السن (BMR غالبًا يقل مع الشيخوخة لنقص العضلات)، الجنس وتركيب الجسم، الرياضة والكتلة العضلية، نوع الأكل، النوم، المناخ، الحمل والرضاعة والحيض، عوامل السكان والبيئة، والتوتر والانفعال. الرياضي BMR عنده غالبًا أعلى عشان العضلات حتى وهو مرتاح، مش لمجرد إنه بيتحرك أثناء التمرين.\nالعوامل المرضية في جدول المنهج: Hyperthyroidism وHyperpituitarism وHyperadrenalism والحمى وأنيميا/لوكيميا وفشل القلب المصحوب بضيق التنفس ترفع؛ بينما Hypothyroidism وHypopituitarism وHypocorticism وانخفاض الحرارة والمجاعة والصدمة تخفض. ركّز على مقارنة Hyper مع Hypo في الغدد، وعلى الفرق بين Fever وHypothermia.","key_en":"PHYSIOLOGICAL FACTORS: age, sex, athletic/physical habits, dietary habits, sleep, climate, pregnancy/lactation/menstruation, group differences and anxiety/tension. At comparable body size, people with more lean muscle generally have higher BMR. Sleep can decrease metabolic rate by roughly 10-15% relative to wakeful rest. Cold climates may cause adaptation with increased heat production. Pregnancy and lactation increase energy needs; emotional tension may raise epinephrine output and muscle tone. Protein intake induces a larger thermic response than carbohydrate.\nPATHOLOGICAL INCREASE: hyperthyroidism; hyperpituitarism; hyperadrenalism; fever; anemia/leukemia; heart failure with dyspnea. DECREASE: hypothyroidism; hypopituitarism; hypocorticism; hypothermia; starvation; shock. Illustrative course figures: hyperthyroidism +50 to +100%, hyperpituitarism +15 to +20%, hyperadrenalism about +150%, not universal clinical constants."},{"page":40,"title":"Specific Dynamic Action of food","body":"SPECIFIC DYNAMIC ACTION (SDA), or thermic effect of food, is the OBLIGATORY INCREASE in metabolic rate after food ingestion. In the lecture it begins ~1 hour after eating, peaks in ~4-5 hours, and may last 12-14 hours. Percentages taught: PROTEIN ~30%, CARBOHYDRATE ~6%, FAT ~4%, MIXED DIET ~10%.\nSDA rises with the amount/proportion of protein; energy generated may be lost as heat and environmental temperature influences heat handling. SDA is not explained by mechanical digestion alone: intravenously delivered nutrients may also increase metabolism. Nutrient processing and hormonal/autonomic responses, including sympathetic activation, contribute. A protein-rich meal has the largest SDA in this textbook model.","explain_ar":"SDA أو Thermic Effect of Food يعني ارتفاع معدل الأيض بعد تناول الغذاء بسبب هضمه وامتصاصه ومعالجته داخل الجسم. مش الهضم بس؛ المغذيات لما تُعطى بالوريد يمكن أيضًا ترفع الطاقة المصروفة لأنها تحتاج عمليات تمثيل غذائي. يبدأ التأثير وفق المحاضرة بعد حوالي ساعة، يصل للقمة في 4–5 ساعات، وقد يستمر 12–14 ساعة.\nأرقام المنهج المهمة: Protein ≈30% (الأعلى)، Carbohydrate ≈6%، Fat ≈4%، Mixed diet ≈10%. زيادة كمية البروتين ترفع تأثيره. الحرارة الناتجة تُفقد للبيئة، وتوجد مساهمات عصبية وهرمونية مثل النشاط السمبثاوي. الربط بالمحاضرة الرابعة: الأكل يمكن يزيد إنتاج الحرارة في البرد.","key_en":"SPECIFIC DYNAMIC ACTION (SDA), or thermic effect of food, is the OBLIGATORY INCREASE in metabolic rate after food ingestion. In the lecture it begins ~1 hour after eating, peaks in ~4-5 hours, and may last 12-14 hours. Percentages taught: PROTEIN ~30%, CARBOHYDRATE ~6%, FAT ~4%, MIXED DIET ~10%.\nSDA rises with the amount/proportion of protein; energy generated may be lost as heat and environmental temperature influences heat handling. SDA is not explained by mechanical digestion alone: intravenously delivered nutrients may also increase metabolism. Nutrient processing and hormonal/autonomic responses, including sympathetic ac
